body:
  text: 卷三溫病脈論冬月傷於寒即病者為傷寒不即病而伏藏於中至春隨陽氣發見者為溫其症頭痛項強與傷寒無異惟初起不惡寒便發熱脈數為異耳傷寒由表入里不得不先發其表溫病由里達表不得不先清其里所以溫病有誤汗而無誤下之語仲景著傷寒一書自秋分後至春分前止若春分後則為溫矣內經雖有先夏至日者為溫病之文仲景雖有太陽病先發熱者為溫之論晉唐以來無人剖晰傷寒溫病概以傷寒書治之得失參半治此症者茫無主張延至於金劉河間出始著溫論有明喻嘉言復暢其說溫病乃有圭臬而仲景之書亦得以昭著於世當此韶光明媚之天三陽出於地上十月純陰用事在卦為坤至十一月黃鐘應律為復卦則一陽生十二月太呂應律為臨卦則二陽生正月太簇應律為泰卦則三陽生日麗風和花香鳥語一片春溫之氣盎盎蓬蓬盎盎和藹之狀蓬蓬司空圖二十四詩品蓬蓬遠春故病亦名之曰溫輕則白虎湯人參石膏粳米知母炙草黃芩芍藥湯黃芩芍藥炙草葛根升麻湯升麻葛根芍藥炙草重則三承氣湯大承氣湯大黃芒硝厚朴枳實小承氣湯大黃厚朴枳實調胃承氣湯大黃芒硝炙草無不應驗間亦有先惡寒而後發熱者仍以傷寒治之又曰冬不藏精春必病溫蓋冬主閉藏漏泄春光杜詩漏泄春光有柳條邪之所湊其氣必虛古人婚姻六禮定在桃夭之時良有以也余則謂熱蘊之極必致煎熬腎水遇體之充足者但以前湯治之倘體之虛怯者不問精之藏與不藏前湯中重加生熟二地以培其本生地熟地黃芩芍藥貝母生草則二說不相歧而相為用矣何必如喻嘉言之分疏其說也乎暑熱脈論同是夏月病也頭痛身熱面垢自汗而暑熱分焉暑為陰邪熱為陽邪觀於天地可知矣炎風翕欻草木榮而就枯烈日熏蒸溝洫盈而立涸陽氣發散於外者底裡必然虛空源遠之井清冷如冰岩谷之風寒淒若刺人一小天地也深居房室靜坐不啻趨炎奔走道塗周行常思蔭暍陽氣發泄於外者底裡亦必虛空舉動心艱肢體疲倦居恆氣短精力衰頽故其為病亦因其氣而感之耳其中暑也感地竅之氣陰與陰遇頭痛身熱面垢自汗與中熱無異而小便清利大便溏瀉嘔吐少氣安靜好眠脈則虛怯亦有虛數者較之中熱大相徑庭焉暑必傷氣非黃耆不足以益其氣暑必兼濕非焦術不足以燥其濕暑必積寒非附子不足以溫其寒經驗方附子焦朮黃耆乾薑苡米扁豆雲苓炙草潔古曰靜而得之為中暑是也其中熱也感天炎之氣陽與陽遇頭痛身熱面垢自汗與中暑無異而小便赤澀大便堅硬胸滿氣喘煩躁不眠脈則洪數較之中暑殊隔天淵焉熱甚發燥非麥冬不足以清其燥熱甚為毒非黃連不足以解其毒熱甚涸水非豬苓不足以利其水經驗方麥冬黃芩澤瀉焦朮豬苓茯苓前仁炙草潔古曰動而得之為中熱是也五行之中惟火有二所以五運而有六氣也有六氣因有風寒暑熱燥火六淫熱即火病也方書所注有謂暑為陽邪心屬離火故暑也入心吾不知將熱置於何地有將暑分陰症陽症而火則牽扯諸火亦知火乃六淫內之火乎有以暑為夏月之傷寒吾不知暑又是何病千書一律開卷茫然總於五運六氣未能細心體認余因參互考訂力為剖別驗之於症實有毫髮不差者痢症脈論痢有不與世相遞嬗而名則因時而變易方策所傳其來有自不容不據古以准今素問謂之腸澼難經謂之裡急後重漢謂之滯下晉謂之秋燥至唐方謂之痢即其名而繹其義便血曰澼痛甚曰急壅塞曰滯皺裂曰燥不利曰痢痢之情形已顯示於稱名之表歷代以來揚榷指陳不啻以暮鼓晨鐘發人深省治是症者顧可孟浪從事翻欲緘滕扃鐍莊子將為胠篋探囊發匱之盜而為守備則必攝緘滕固扃鐍此世俗之所謂知也然而巨盜至則負匱揭篋擔囊而趨惟恐緘滕扃篋之不固也注鐍開也而置之死地乎當此暑炎方退金飈初起土間其中土旺於四季五六得天地之中以未土為正熱燥濕匯於一時三氣湊而為病有時行者從皮毛入微惡寒腹痛瀉盡宿食方轉紅白風之所過行於一家則病一家行於一境則病一境有傳染者從口鼻入不惡寒腹痛隨瀉宿食即轉紅白氣之所觸染於一人則病一人染於一方則病一方於斯時也撫枕席而興嗟何分男女如廁坑而抱痛左傳晉景公有疾將嘗麥如廁陷而卒莫測死生天氣陰晴垢聞一室燈光明滅呻徹五更飫膏粱者無論已可憐寒士當災朋盡回車難邀甲戍之峙書費誓甲戍峙乃糗糧人皆掩鼻徒傳庚癸之呼左傳吳與魯會吳子不與士兵飢渴大夫申叔儀乞糧於魯大夫公孫有山氏對曰糧則無矣粗則有之若登首山以呼曰庚癸呼則諾杜注軍中不得出糧故為隱語庚西方主谷癸北方主水聚桑梓者猶可也最苦旅人遠適今雨不來杜甫詩舊雨來今雨不來誰恤零丁異地文天祥詩惶恐灘頭說惶恐零丁洋里嘆零丁聞風爭避哪管客子離鄉儒者考古今之得失證一己之功修於是證而果參上乘焉本來惻隱之心自應以之普度也喻嘉言曰初用辛涼以解表次用苦寒以清裡劉河間曰調氣則後重自除行血則膿血自止余於痢之時行初起者而宗嘉言焉疏經絡而驅邪敗毒散人參羌活獨活柴胡前胡川芎枳殼桔梗茯苓炙草克壯元老之猷於痢之傳染初起者而宗河間焉和營衛而導滯芍藥湯芍藥歸尾黃芩黃連大黃木香檳榔肉桂炙草允占大人之吉及其歸宿鬱則為熱試診其脈未有不數者所以香連丸黃連二十兩吳萸十兩同炒木香四兩八錢不見火共研末醋糊為丸為治痢之總方顧在表忌用者邪猶未入於裡也久病難用者恐重傷其生氣也昔趙養葵以六味地黃湯治傷寒人飢為趙氏之創見而下多傷陰余嘗以六味湯治痢此又余之創見也如果脈虛自汗赤白將盡真人養臟湯粟殼訶子肉豆蔻木香肉桂人參白朮秦歸白芍甘草寒甚加附子一方無秦歸訶子散粟殼訶子乾薑陳皮為末空心服俱可斟酌而用之夫痢不分赤白既出於熱翻服辛熱而愈者附子肉掛乾薑焦朮砂仁炙草此乃從治之法蓋人之稟賦有寒有熱邪熱之中人每從其類而化辛熱藥能開鬱解結使氣血得以宣通特宜於以寒化熱之人若遇以熱化熱而誤用之其禍將不可勝言矣存心濟世者倘遇以寒化熱之痢用溫補而大獲其效慎毋執以為例瘧疾脈論儒者讀書十年窮理十年自謂於醫已通三昧及其視病兩相齟齬不歸責藥肆之假便諉咎染病之真與之強辨無庸也請試之治瘧夫瘧病之淺而顯者也最易足以驗醫之得失世之用劫藥而僥幸以取功者不在此論如果堂堂之陳正正之師而百戰百勝焉庶可懸壺都市後漢書費長房者汝南人也為市椽市中有老翁賣藥懸一壺於肆頭及市罷輒跳入壺中市人莫之見惟長房於樓上觀之異焉因往再拜翁乃與俱入壺中惟見玉堂嚴麗旨酒甘肴盈衍其中共飲畢而出後乃就樓上候長房曰我神仙中人以過見責今事畢當去負籠鄉邦猶是投之罔效屢易其方古籍粃糠空披萬卷寒窗燈案辜負十年經曰邪氣客於風府循膂而下背脊骨兩旁曰膂並頂骨三椎至尾骶骨二十四椎其氣上行由尾骶骨上行九日出於缺盆肩下橫骨陷中余讀經文而知瘧脈之所以弦也軀殼之內臟腑之外屬半表半裡而邪居之宜脈之弦與少陽同是放風無常府以所中處為府其中頂骨也三陽之脈皆上於頭陽明之脈循髮際至額顱邪氣並於陽明令人頭痛灑淅寒甚久乃熱則為陽明之瘧少陽之脈上抵頭角下耳後邪氣並於少陽令人頭痛寒不甚熱不甚惡見人則為少陽之瘧至於太陽之脈從巔入絡腦還出別下項正過風府處故頭痛腰痛體重寒從背起所以中於陽者太陽之瘧居多其中骶骨也三陰之脈皆發於足太陰之脈上膝股內入腹邪氣併入太陰令人足軟不嗜飲食多寒熱則為太陰之瘧厥陰之脈入毛中繞陰器邪氣併入厥陰令人足軟小腹滿小便不利則為厥陰之瘧至於少陰之脈上股後廉直貫膂正當風府處故足軟嘔吐甚多寒熱熱多寒少所以中於陰者少陰之瘧居多其中於陽也陽氣漸入於陰分日下一節其行也遲故其作也日晏一日難愈其中於陰也陰氣轉入陽分日上二節其行也速故其作也日早一日易愈治之之法瘧在三陽則以三陽治之陽明經症葛根升麻黃芩芍藥草果炙草薑棗引陽明腑症大黃芒硝檳榔厚朴炙草薑棗引少陽症青皮飲青皮厚朴柴胡黃芩法夏雲苓白朮草果炙草薑棗引太陽經症麻黃桂枝杏仁炙草薑棗引太陽腑症焦朮茯苓豬苓桂枝澤瀉草果炙草薑棗引瘧在三陰則以三陰治之附子理中湯加草果統治三陰玉竹焦朮乾薑草果炙草附片薑棗引倘弦化脈虛有汗但輔其正氣而邪自除則統陰陽而溫補之經驗方黃耆焦朮附子首烏秦歸玉竹草果雲苓炙草薑棗引未有不隨手而效者機要曰瘧有中三陽者有中三陰者其症各殊同傷寒論知治傷寒則知治瘧余謂第知治傷寒猶不足以治瘧知傷寒矣而知邪客風府則足以治瘧矣所同於傷寒者症所異於傷寒者脈傷寒之脈隨陰陽變遷瘧症之脈一弦字貫徹知所以治傷寒而於陰陽勝復之理邪正交戰之時臟腑行經之穴無不灼知之矣業醫者欲驗一己之功修請自試之治瘧傷風脈論六淫以風為首人觸之為傷風憎寒壯熱頭痛身痛嘔吐口渴脈浮而數張元素羌活湯羌活防風黃芩白芷川芎蒼朮細辛生地炙草薑蔥棗引不犯三陽禁忌俗稱治傷風神方且冬可以治寒春可以治溫夏可所治熱秋可以治濕為諸路之應兵但夏月傷暑脈虛身熱在所禁耳旅店山居醫難卒辦者皆可自檢其方而用之論未竣客有笑於旁者曰世當叔季元氣衰薄雖傷風亦當用補豈可概以羌活湯為治外感之總劑乎余勃然曰君言時當叔季對洪荒而言在岐黃撰寫靈素二經已言叔季何況今日至所言元氣衰薄謬亦甚矣欲知今時當觀已往孔子刪書斷自唐虞唐虞之前無論已儒者侈言夏後殷周之盛夏都安邑四百四十一年歷年多者僅見一二商都於亳六百四十四年歷年多者僅見一二周都豐鎬八百七十四年視夏商之元氣較厚武王九十三穆王百有四歲信史豔稱而長壽者尚不止二君以及柱下吏漆園叟關令尹王子晉接踵而生三代之元氣如是云云經嬴秦二世耗散殆盡西漢都於長安二百十有三年高祖五十三武帝七十一餘元五十之壽東漢都於洛陽一百九十六年光武六十三明帝四十八余無四十之壽猶幸以壽名世者黃石公赤松子東方朔魏伯陽有數可紀自漢末歷魏晉五代元氣衰薄極矣四百餘年中在位一二年居多享壽一二十過半迄唐大統歸一元氣方轉二百八十九年君之五十餘歲者猶數數覯為之臣者許旌陽孫思邈鍾離權呂岩類皆以壽稱由後梁五代以致宋元明元氣又寢衰矣七百餘年中位無五十年壽少五十歲其時若陳摶張平叔冷謙周顛而外壽不概見歷代元氣彰彰可考天運循環無往不復逮及我朝元氣大轉以一萬八百年為一時計之堯舜在中天之初距今四千餘年今正當中天之中膺彼蒼之眷顧代見聖人之生鍾維嶽之精靈世徵仁者之壽貞元會合間氣渾涵滌環宇之妖氛宏開壽域躋斯民於渾噩普樂春臺雨時腸若海宴河清五星聯珠兩曜合璧一時應運生者相皆耄耋人率期頤廣洛浦之耆英宋史文路公彥博結洛陽社惟司馬溫公光年未七十共余俱八十九十老人謂之洛社耆英會屢屢開千叟之宴集香山之人瑞潛確類書白樂天年七十以刑部尚書致任自號香山居士會老年宴集於履道里合之得九人皆年高致仕者人慕之繪為九老圖在在建百歲之坊余家世居邵邑資水之湄龍山之麓同時百歲者五人水之北盧老羅老一婦歸黃山之南一婦歸呂一婦氏唐而八十九十者指不勝屈一武庠石輯五年已八十矣弓著六鈞矢穿七札演劇猶作小旦之音即吾門一領青襟相傳五代高祖諦直公冊名周應京曾祖元愷公冊名周士雋祖存仁公冊名周良階父誕登冊名周道岸俱年愈八十詳於乘冊外祖黃正禮九十七在黌門八十有三母舅黃文鐸九十三為孝廉六十餘二世上難逢百歲人古人語也想古來百歲最難覯以今觀之當易之曰世上隨逢百歲人人生七十古來稀唐人詩也想唐時七十歲者亦稀有今觀之當易之曰人生七十世間多元氣之足稟賦之厚三代以來未有如我朝之盛者治病者亦惟率由舊章焉耳傷風漫云補乎哉傷寒脈論傷寒一書後漢張機所著發明內經奧旨啓萬世之章程為醫門祕訣其文佶屈其義窔穾其方簡峭而警闢有志集注適有養胎之舉托跡昭潭漣源黃德安同里舊交寄居潭市主於其家慫恿著論力救時世客舍清閒竊舉茅廬誦讀時所心得者提要成篇姑從簡略攜稿詣省垣衡邑成子凝秀故人新吾子也隨謄真以補前刻經曰傷寒一日巨陽受之一日一次也不以日數拘巨陽太陽也太陽經也膀胱腑也經脈從癲絡腦夾脊抵腰受之受其邪也時值觱發栗冽有寒有風寒為陰邪傷營風為陽邪傷衛其中風也經先受其風桂枝症不以病名病而以藥名病者重乎其藥也脈浮而緩頭痛項強而惡寒有風不皆無寒過時即熱有汗鼻鳴而惡風倘消渴而小便不利邪入膀胱腑之衛分矣五苓散主之其中寒也經先受其寒麻黃症脈浮而緊體痛統頭痛身疼腰痛骨節疼痛而言嘔逆而惡寒歷時方熱無汗喘滿而惡鳳有寒不皆無風倘如狂淤熱衝心而小腹急結淤熱不行邪入膀胱腑之營分矣桃仁承氣湯主之大青龍湯治風寒兩中經而煩躁寒鬱於外熱蒸於內陰陽攻擊小青龍湯治風寒兩中腑之乾嘔小便不利心下有水氣乾嘔或兼咳兼渴兼噎兼喘中風經症桂枝湯桂枝芍藥甘草生薑大棗服已須臾飲熱稀粥以助藥力溫覆一時許取微汗發汗遂漏不止惡風小便難四肢微急難以屈伸桂枝湯加附子發汗後而喘麻黃杏仁甘草石膏中風府症五苓散豬苓茯苓澤瀉白朮肉桂中寒經症麻黃湯麻黃桂枝杏仁甘草溫服覆取汗發汗不解反惡寒者虛故也芍藥炙草附子三味溫服發汗後身疼痛脈沉遲者桂枝生薑人參芍藥甘草大棗發汗過多叉手冒心心下悸欲得按者桂枝炙草二味煮去滓頓服未經汗下脈沉當溫其里宜四逆湯附子乾薑炙草未經汗下心悸而煩者小建中湯桂枝芍藥炙甘草生薑飴糖中寒府症桃仁承氣湯桃仁桂枝大黃芒硝炙草發汗若下之懊憹不得眠胸中窒礙者梔子十四枚香豉四合煮去滓溫服得吐則止大下後惡寒痞結桂枝湯先解惡寒大黃黃連二味煮去滓溫服以攻痞心下痞而復惡寒汗出者附子瀉心湯大黃黃連黃芩附子風寒雨中經症大青龍湯麻黃桂枝炙草杏仁生薑大棗石膏風寒雨中腑症小青龍湯麻黃芍藥五味甘草乾薑半夏桂枝細辛渴去半夏加栝蔞噎去麻黃加附子小便不利小腹滿去麻黃加茯苓喘去麻黃加杏仁發汗若下之病仍不解煩躁者茯苓四逆湯主之茯苓人參炙草乾薑附子二日陽明受之陽明經也胃腑也經脈起鼻額循鼻外系目系居戊土之鄉原稟坤靜攝離火之篆陽明純熱反攬乾剛脈浮而大煩渴目痛鼻乾不得眠者陽明經病也脈浮而實潮熱譫語腹滿大便硬者胃家腑病也經病治以白虎湯腑病治以三承氣湯其為正陽明則然六經雖分陰陽而宰之者陽明為六經之所朝宗即為六經之所歸宿三陽有類聚之條三陰有轉屬之症太陽陽明不更衣不大便而無所苦脾約丸少陽陽明時煩躁而大便難以法治之大實腹痛陽明雜見太陽之篇桂枝大黃湯土燥水乾陽明混入少陰之類急下之脈滑而厥里有熱白虎湯厥陰中亦有陽明隨經而見妙蘊無方陽明經症白虎湯石膏粳米知母炙草附録錢仲陽葛根湯葛根升麻白芷炙草大棗生薑陽明腑症三承氣湯汗吐下後微煩小便數大便硬小承氣湯大黃厚朴枳實腹脹滿調胃承氣湯大黃炙草芒硝不大便發熱汗多大承氣湯大黃厚朴枳實芒硝太陽陽明脈浮而澀麻仁脾約丸麻仁芍藥枳實大黃厚朴杏仁少陽陽明以法治之相胃家虛實加減下桂枝大黃湯見後少陰急下之大承氣湯備録陽明症方身黃如橘子色小便不利茵陳蒿湯大黃茵陳梔子身黃髮熱梔子黃柏炙草三日少陽受之少陽經也膽腑也經脈循脅絡耳兼木火之德屬甲木寄相火司出入之門入太陽出太陰邪犯經胸滿脅痛而耳聾邪犯腑口苦膽熱上蒸嘔逆膽熱上衝而目眩膽熱上熏脈之大者變而為弦症之熱者轉而似瘧居陰陽之界半表半裡通陰通陽無汗下之方禁汗禁下邪正相持進退互拒小柴胡湯為和解少陽之統劑而其變則有辨焉者嘔逆膽熱而腹痛胃寒黃連湯分理陰陽嘔吐而硬胃實煩鬱熱大柴胡湯雙清表裡宜應手而解方工勿藉口於和為套小柴胡湯柴胡黃芩人參法夏炙草生薑大棗胸中滿而不嘔去法夏人參加栝蔞仁渴去法夏加人參花粉腹痛去黃芩加芍藥心下悸小便不利去黃芩加茯苓黃連湯黃連炙草乾薑人參桂枝半夏大棗大柴胡湯柴胡半夏枳實大黃黃芩芍藥生薑大棗備録少陽症方胸脅微緒小便不利柴胡桂枝乾薑花粉黃芩牡蠣炙草服柴胡湯已反渴以陽明治四日太陰受之太陽經也脾臟也經脈布胃中絡於嗌邪入陰分經臟齊病陰陽變態之妙有不見其朕兆陽邪入陰尺寸皆沉腹滿吐食自利有腹滿時痛之寒症理中丸即有腹滿實痛之熱症桂枝湯加大黃有得食緩吐之寒症理中丸通治即有得食即吐之熱症乾薑黃連湯有自利不渴當溫之寒症理中丸通治即有自利腐穢當下之熱症大承氣湯蓋人之形有厚薄氣有盛衰臟有本寒本熱每從賦稟以為轉移如必以直中為寒傳經為熱其何解仲景寒熱並論列於四日理中丸人參白朮炙草乾薑搗碎蜜和為丸如龍眼大以沸湯和一丸研碎溫服乾薑黃連湯乾薑黃連人參五日少陰受之少陰經也腎臟也經脈系舌本生人之命蒂安危繫於少陰病則脈細欲寐自利發厥手足冷曰厥口乾舌燥渴欲飲水自救無奈水火同宮辨別最宜分曉挾水為動則為陰邪挾火而動則為陽邪陰邪脈沉細而遲陽邪脈沉細而數陰邪但欲寐身無熱陽邪雖欲寐心多煩陰邪下利清穀陽邪下利清水陰邪面赤而裡寒小便白陽邪手足厥而裡熱小便赤陰邪口乾舌躁而帶和陽邪口乾舌燥而至裂陰邪渴欲飲熱水以自救陽邪渴欲飲溫水以自救臨症審視只爭芒芴寒症方身體痛附子湯附子茯苓人參白朮芍藥四逆湯通治炙草乾薑附子下利白通湯蔥白乾薑附子手足冷煩躁欲死吳茱萸湯吳茱萸人參生薑大棗熱症方心煩不臥黃連湯黃芩黃連芍藥雞子黃阿膠咽痛甘桔湯甘草桔梗口爛咽乾大承氣湯自利清水色純青心痛口乾大承氣湯六日厥陰受之厥陰經也肝臟也經脈繞陰器抵小腹貫心膈傳經而至厥陰在時為醜在歲為冬在卦為坤脈細肢厥厥逆也四肢以溫為順以冷為逆煩渴囊縮症則猶是也而治法懸絶漏盡更殘四望陰霾而有純寒無熱之症天寒地凍滿腹陽春而有純熱無寒之症陰凝於陽必戰其血元黃而有陰陽錯雜之症彼純寒而厥當歸四逆湯夫人而知之熱愈深厥愈深純熱之厥甚於純寒非急下不足以救水醫將何以決之脈數咽乾小便赤而況陰陽錯雜者之眩人耳目乎當此陰盡陽回晦朔交卸之時仲景立烏梅丸以安蛔其實統陰陽而治醫而知治厥陰醫道其庶幾乎純寒症當歸四逆湯當歸桂枝芍藥細辛通草甘草大棗下利清穀裡寒外熱汗出而厥者通脈四逆湯純熱症急下大承氣湯陰陽錯雜症烏梅丸烏梅三百枚細辛六兩乾薑十兩黃連十六兩當歸四兩附子六兩蜀椒四兩桂枝六兩人參六兩黃柏六兩上十味共搗篩合治之以苦酒漬烏梅一宿去核蒸之五升米下飯熟搗成泥和藥令相得納臼中與蜜杵二千下如梧桐子大先食飯服十丸日三服稍加二十丸禁生冷滑物臭食等備録脈滑而厥里有熱白虎湯夫三陰三陽班班可考而有治表裡急治里表急陰同乎陽為兩感太陽少陰同病陽明太陰同病少陽厥陰同病余讀經文莫治仲景無方不禁憮然三嘆焉竊意表重於里者以里為主稍解其表里重於表者純治其里管窺之見不敢告人壯遊四方而以此法活人居多偶撿李挺傷寒論閲亦有是說餘生也晚安敢並駕古人不謂理之所在古今人所見有略同也岐伯仲景有知其將許我友李梴為徒乎若世所傳大羌活湯則吐棄之矣至於合病並病壞病勞復食復飲酒復陰易陽易陰陽易六經精透舉而措之裕如一百一十三方採方總撮要領三百九十七法注法悉本原文練就長沙仲景為長沙太守人稱張長沙之明珠化作涅槃佛說法處金剛經入涅槃而滅度之之舍利牟尼珠名舍利子瘟疫脈論春溫夏熱秋涼冬寒及天地之正氣人感之而病者為正病久旱亢暘淫霖苦潦洪範一極備凶一極無凶注極備過多也極無過少也唐孔氏曰雨多則潦雨少則旱是極備亦凶極無亦凶雨暘寒燠之不得其正者為四時之沴氣氣輪歲會五運甲己化土乙庚化金丙辛化水丁壬化木戊癸化火土運臨辰戍丑未金運臨申酉水運臨亥子木運臨寅卯水運臨己午運氣與地支年辰相會故曰歲會運值天符六氣子午之歲少陰火司天陽明金在泉卯酉之歲陽明金司天少陽火在泉丑未之歲太陰土司天太陽水在泉辰戍之歲太陽水司天太陰土在泉寅申之歲少陽相火司天厥陰木在泉己亥之歲厥陰木司天少陽火在泉大寒至小暑司天主之大暑至小寒在泉主之火運之歲上見少陽土運之歲上見太陰金運之歲上見陽明水運之歲上見太陽木運之歲上見厥陰歲運與司天合故曰天符水火木金之各據其偏者為八方之癘氣合癘與沴釀而為毒人感之而病者為瘟疫雜見於四時在春謂之春瘟在夏為之熱病在秋謂之晚發痢亦名晚發在冬謂之寒疫內經著於岐伯爰詳五疫之文內經刺法論帝曰余聞五疫之至皆相染易無問大小病狀相似不施救療如何可得不相移易者岐伯曰不相染者正氣存內邪不可干避其毒氣天牝從來復得其往氣出於腦即不幹邪氣出於腦即先想心如日欲將入於疫室先想得青氣自肝而出左行於東化作林木次想白氣自肺而出右行於西化作戈甲次想赤氣自心而出南行於上化作焰明次想黑氣自腎而出北行於下化作水次想黃氣自脾而出存於中央化作土五氣護身之畢以想頭上如北斗之煌煌然後可入於疫室周禮掌於方相聿嚴逐瘟之令周禮方相氏掌蒙熊皮黃金四目衣朱裳執戈揚盾師百隸而時儺以索室驅疫曲禮季冬大儺月令九門磔攘尼山於鄉人行儺朝服而立阼階皆古聖節宜燮理之義故民無夭札得以嬉遊於光天化日之宇誠盛事也後世踵而行之由是生養斯民之至意方書之逐瘟者其立心亦如之良相良醫合為一手其為瘟也稱名攸異大頭瘟軟腳瘟蝦蟆瘟疙瘩瘟其為斑也形容各殊赤霞斑紫金斑緑雲斑黑砂斑互相傳染大小相似初起邪氣客於募原難經六十七難注五臟之募皆在腹五臟之俞皆在背原即俞之根本募原軀殼之裡經脈所繫之處頭微痛或不痛微惡寒或不寒但一於熱脈數無倫沉沉默默到夜尤甚郁遏之極邪從表出謂之外潰或大汗鼻血隨汗與血而解若邪侵胃腑則內潰矣瀉則完穀不化結則堅硬如石胃枯腸腐舌黑唇青無所不至是為天地之毒氣常以肅殺而為心激一己之心肺肝腸魂飛魄走捧心憔悴之形愁雲遍野環四境之鄉閭里黨鬼哭神號滿目淒涼之色毒霧蔽空惟不知其毒而妄治之盈城盈野死於非命知其毒而善調之沿門沿戶立起沉疴其在未潰之初毒猶盤踞募原驅伏魔全憑草果破堅壘須藉檳榔吳又可達原飲檳榔草果厚朴知母芍藥炙草黃芩嘉靖己未江淮大疫用敗毒散倍人參去前胡獨活服者盡效萬曆己未大疫用本方復效大抵毒在募原加參於表劑元氣不因表而受傷以表劑而加參毒氣不藉參而助瘧與達原飲用知母芍藥同參至於內潰兩方俱無用矣惟有一下再下之法毒而外潰漸殺其勢矣即貝母柴胡可以和其事經驗方柴胡生地貝母黃芩銀花生甘草茅根引毒而內潰愈縱其悍矣非芒硝大黃奚能奏其功經驗方芒硝大黃檳榔厚朴枳實炙草薑棗引下以毒盡為度知斯三門病無遁形設方攻毒妙在一心三門初中募原外潰內潰精透三門之奧不過借達原飲經驗方為之榜樣道人自瓶鉢以來所過省垣郡邑遇是症全活約計數千並無一定之方藥倘備録其案即此一症可以盈箱夫瘟疫乃四時不正之氣溫乃四時之正氣性命攸關最宜分別景嶽瘟疫問中抄寫溫病及傷寒之經文雜湊成章毒害蒼生者莫此書為甚陽犯醫門之刑喻嘉言著醫問法律擢髮難數陰設海底之獄阿鼻難逃鐵鐫錎注大海之底有石名燋沃縱橫八萬四千里厚二萬里下有八大地獄八名阿鼻地獄若吳又可其於瘟疫根源雖未必解透細閲吳又可瘟疫論從內經瘧論邪氣客於風府橫連募原悟出其撰之方即從前人截瘧方化裁真千古慧人也至其所論傷寒少而瘟疫多世醫執其說凡偶感風寒便曰瘟疫一言之誤貽禍千秋而其治法極為精微劉李朱張下實為岐黃功臣室女脈數反吉論小兒純陽脈常有六七至甚有八九至者室女血盛脈上魚際亦常有六七至者脈經但言脈上魚際而不言數余嘗見上魚際之脈未有不數者蓋脈即血也血盛則脈長而洪血衰則脈短而澀室女貞元未虧血海充滿其脈之數亦固其所但得嬌姿豔麗體態輕盈謂之無病可以勿藥惟是蘭閨寂寞紗窗月靜繡幕風清時覺氣體不安延醫調冶但見其脈數而以為病則誤矣脈經曰脈數惟有兒童作吉看余即補之曰脈數室女亦應作吉看月經脈論坤順德也配乎乾則萬物化醇女陰象也從乎陽則萬物化生圖書以七為少陽之數逢陽則化故七月生齒七歲毀齒二七十四而天癸至是乃先天一點真陽之水易所謂男女媾精禮所謂一陽來復水泉始動者此物此志也積四千八百之期合一大藏經於以充於中而溢於外其象上應乎月三五而盈三五而缺周三十日而旋轉如環故稱經焉經者正也正直無私經者常也經常不變本坤之德應月之精以生男生女原生生於不已乃或為藥餌所傷或以憂思而傷孰為不及期孰為過期在前在後無所不至矣夫不及期為熱過期為寒此其常也亦有不及期為寒過期為熱者總分於遲數虛實之脈而已矣其為藥餌傷也過服寒涼弊為淤閼過服溫補備見沸騰蓋血陰也喜靜而惡躁靜則培養躁則消亡嘗見膏粱之家未有妄服寒涼者火鬱至極不得而已斟酌服之在醫士擅長半屬溫補之方胡為閨居氣滯本非虛也而以為脾虛輒豫以黃耆白朮閒坐寒生本無寒也而以為命門不足輒豫以附子乾薑至煎熬之極或血因火動一月數行或血為火灼數月一行詎知不及期與過期之俱關於藥乎其為憂思傷也心地安舒應期而至心地抑鬱愆期而來蓋血營也好聚而惡散聚則充周散則奔突縱觀閭閻之衆未有不樂安舒者暴怒頻加不期然而憂悶攻之彼女子善懷本多抑鬱之隱甚至掣肘於翁姑致血上溢非有餘也而以為血滿罔顧其釁起勃溪反目於夫壻致血橫行非不足也而以為血虧罔顧其悲由葑菲至鬱積日久或稍如其意行則後期或仍拂其意行則前期詎知前期與後期之皆繫於憂乎由是觀之傷於憂思而無子者順其心養其神猶可挽回傷於藥餌而無子者誦其經禱其佛難以救復蓋天地之大德曰生而鼓其生機者和風以散之遲日以暄之雨露滋培土膏潤澤自然生意婆娑一經炎風之煽烈日之焚土脈焦枯英華何由發越天地猶是也而生機倦矣人得天地之生以為生而暢其生機者靜攝乃氣調和乃血陰陽交錯子宮溫暖自覺生育綿延一經燥熱之侵辛溫之耗血元羞澀胚胎奚自結凝人則猶是也而生機絶矣道人一瓢一笠雲遊以來見艱於嗣息求治者盈門擁案及閲前所服之藥無非溫補之藥詢前所延之醫無非溫補之醫比比皆然令人萬不可解顧考其服藥之初亦覺與溫補相宜氣體龐然而豐隆也姿態嫣然而明媚也飲食紛然而並進也醫之用藥即此歷之階耳惟是瓦積之場不堪黍植塊存之體安望熊占所願蘭房淑媛繡閣名姝體坤之道順月之恆勿貪藥餌惟葆幽閒以副天地好生之德庶道人救世婆心亦不至詆為饒舌耳胎前全憑脈論憑脈為的治病而至胎前其看症也歷歷彔彔其用藥也離離奇奇黃芩安胎者也烏頭傷胎者也而胎當其寒結黃芩轉為傷胎之鴆血烏頭又為安胎之靈丹明黨焦朮砂仁附片建薑秦歸炙草焦術安胎者也芒硝傷胎者也而胎當熱結焦術反為傷胎之砒霜芒硝又為安胎之妙品芒硝五錢滾水澄去滓調蜜服當此兩命相關以安為傷以傷為安而用之裕如者夫亦曰權脈之遲結數促耳膽從脈出而膽斯大智從脈生而智斯圓無藥不可以安胎無藥不可以傷胎有何一定之方有何一定之藥也乎彼本草之注禁服不過為初學導之先路夫胎症其顯者也由胎症而推脈清而用得其當信石蜈蚣無非參苓耆朮脈溷而用失其當參苓耆朮無非信石蜈蚣拘成見者趙括讀父書而喪師荊公用周禮而亂宋知變化者孔明添灶而退兵楚王破釜而取勝古今來英雄成敗止爭此一心之妙用又何恤乎人言産後不憑脈論百脈空虛瘀血留滯二語足以括盡産後諸病其用藥也補則足以填虛空溫則足以散瘀滯溫補二字在産後極為穩當而見之於脈則未可以一格拘也有遲澀者有沉細者有洪數者有弦緊者遲澀沉細可溫可補若洪數弦緊顧可漫無區別而一於溫之補之乎抑知瘀血填塞隧道血脈為之沸騰虛寒之體轉化為實熱之脈倘憑脈以療病則為發為泄為汗為涼病症百端藥餌肆應非不經營慘淡竭力彌縫乃一病未已一病旋生卒至溫補難施不可救藥豈非專憑脈者階之厲耶余家世傳月科一卷之書得之本邑王定所不診脈但問症細閲書中實是肚腹大脹大痛者先治之以去瘀之本桃仁歸尾胡索靈脂乾薑川芎荊芥穗酒調服其於症之虛寒者固不外肉桂乾薑茯苓炙草當歸川芎焦白朮肉桂蜜黃耆乾薑即症之大熱者亦不離肉桂乾薑百試百驗世無産難之婦遠近求藥者日踵其門傳至於余參究脈理思欲突過前人乃憑脈罔效憑書輒效而後知産後憑脈其理猶淺不憑脈其理方深世之家藏祕本粗視之了無意義而用之多效者大半類此小兒疳脈論道人於聖學本無所窺而少者懷之雅有同志竊於疳症三致意焉十六歲以後謂之癆十六歲以前謂之疳其症頭皮枯澀毛髮焦稀腮縮鼻乾脊聳體削鬥牙咬甲煩渴自汗口鼻溺赤肚脹潮熱酷嗜瓜果泥炭等物外則肢體生瘡是其候也疳之綱領有五脾肺心肝腎至於條目不可窮紀姑舉其要曰脊疳曰蛔疳曰腦疳曰丁奚疳曰無辜疳曰哺露疳名有百端理惟一致惟見症不同不外熱積蟲三者而已考古名方有塌氣丸龍膽湯蘆薈丸木香丸胡黃連丸及各種肥兒丸其理正其義深其效神信非仙家莫傳因方書論症支吾雖傳其方無人敢用如景嶽論中其或氣血兩虛有非大補不可固屬門外之揣摩即錢仲陽為小兒科中一代名醫而以為皆因脾胃虛損亦是老生常談與疳症何涉錢氏如此其他可知道人不惜苦口饒舌細為分析病源既明則作方者之苦心庶得以闡明於世楊氏曰疳者干也道人則曰疳者甘也因奉養太過肥甘之味鬱而為熱蒸而生蟲久而成積而疳以是名焉惟其為熱煎熬津液肌肉為之消削惟其成積肚腹脹大飲食為之減少惟其生蟲吮臟腑則偏嗜異物蝕肢體則瘡癢不痛種種症候大半得之膏粱之家飫藜藿者十居一二道人云遊以來每見朱門子弟反不如居茅屋者之神完氣足總由飲食不節之故何關乎元氣之盛衰脾胃之強弱此其大彰明較著者也名方中不離黃連為君者解其煎熬之熱毒也用蘆薈生地山梔青黛膽草黃柏者清其火也用蕪荑君子川楝雷丸鶴蝨烏梅者殺其蟲也用莪朮神麯山楂麥芽青皮木香者消其積也用干蝦蟆蟾酥者以毒攻其毒也用夜明砂靈脂者去瘀而生新也有是症則有是藥性味之寒與毒夫復何疑嘗見患是症者請一目不識丁之醫或揣之曰莫不是疳將師所傳治疳之方隧撮一帖猶或幸中彼原不知黃連之寒蕪荑之毒請一讀書明理之醫明知是疳開口便曰脾胃大虧非峻補不可枯瘦之軀何堪此黃連之寒蕪荑之毒主人曰穩當不知熱得補而益熾積得補而益堅蟲得補而更多至於不救則曰有命此非讀書之過不善讀書者之過也道高一尺魔高一丈其是之謂歟然則非攻熱積蟲遂可以治疳乎非也五疳有所見之症諸疳又各有所見之症變化生心豈可膠柱鼓瑟不過胸有成竹而後能畫竹然則治疳一於攻而全無補法乎亦非也經曰大毒治病十去五六相其熱退積減蟲安窮寇勿追或調脾理胃滋腎平肝一任醫之運用考古名方治腹脹大塌氣丸白豆蔻麥芽五靈脂砂仁莪朮青皮陳皮君子二錢蝦蟆三錢米糊為丸下蟲丸苦楝子皮酒浸焙貫衆檳榔桃仁木香鶴蝨米糊為丸木香丸治疳痢黃連木香厚朴夜明砂生薑水為丸大蕪荑湯治小兒發熱作渴少食大便不利發黃脫落蕪荑山梔秦歸白朮雲苓柴胡麻黃羌活防風黃連黃柏炙草各二錢四味肥兒丸治小兒食積五疳目生雲翳牙齦腐爛蕪荑神麯麥芽黃連等分為末豬膽汁為丸緑豆大蘆薈肥兒丸治熱疳蘆薈龍膽草木香人參君子麥芽各二錢土鱉去頭足酥炙檳榔黃連各三錢蕪荑胡黃連一錢豬膽汁為丸黍米大龍膽丸治疳腦熱瘡龍膽草升麻苦楝根皮赤茯苓防風蘆薈油發灰青黛黃連煉蜜為丸蟾酥丸治小兒頭頂結核面色黃瘦飲食不甘腹大發熱蟾蜍二三個將糞蛆一杓置桶中以尿浸之即將蟾蜍打死投於蛆食一晝夜用布袋盛起置急流中宿取出瓦上焙乾為末入麝香少許米為丸疑病詐病脈論本無病也而疑之成病積想成因懸擬成象則無病者真以為有病矣彼疑之我亦疑之何以名之為醫本無病也而詐之為病困頓其狀呻吟其聲則無病者真以為有病矣彼詐焉我受其詐焉何以名之為醫而欲使疑者知其為疑多方以解其疑而疑者不疑詐者知其為詐直言以指其詐而詐者不詐亦惟決於脈視其緩而已矣蓋有莫解之症必有莫解之脈疑則必疑為莫解之症而何以診其脈無恙也其為疑必矣有莫起之疴必有莫起之脈詐則必詐為莫起之疴而何以診其脈如常也其為詐必矣杯中蛇影掛弓即解疑者無所施其疑灸難分痛見艾即愈詐者無所用其詐精與脈理者又何疑詐之我欺也哉平人脈歇止無妨論代脈關乎壽結脈因乎寒促脈因乎熱平脈歇止則不關乎壽與寒熱亦自有說蓋一呼一吸脈來六寸血營氣衛息數一萬三千五百通脈行五十度是為一周稍為痰氣所凝則脈為之一止非如代之止有常數結促之止由遲數而得也天地萬古不老而有歲差之數日月萬古長明而有相食之時歲差相食曾何損於天地日月也哉純陰脈症萬物之生負陰而抱陽陰陽調和謂之無病亦有生來脈旺謂之純陽名曰壽脈此脈經所以言者有純陽則有純陰此脈經所未言者余弱冠時常至一地見二婦人一婦二子一婦三子家皆饒裕餘切其脈按之至骨絲微欲絶問其體一毫無病過十年再至其地二婦之子皆入膠庠家亦豐厚再診其脈依然故吾也過十年三至其地一婦之子已登賢書家更倍於昔日診其脈依然如初也距今又十有餘年矣二婦白髮齊眉青襟滿眼其發達更有未可料者脈經注純陽為壽脈不知純陰亦為富貴福壽之脈一婦梅邑癢生謝襲周德配孝廉公謝運躍母鐘太孺人也內外癰疽先變脈論平人飲食仍舊氣體如常而脈數者多發癰疽夫外感脈數驟然而來飲食為之一變茲之脈數何以飲食仍舊也內傷脈數由漸而進氣體為之少減茲之脈數何以氣體如常也其為癰疽也明矣發於外者癰疽並稱後猶可療發於內者但以癰論務須先知凡屬肺癰與胃脘諸癰總是熱毒蘊結四字該之其先少發寒熱漸隱隱作痛斯時清其熱解其毒疏其氣經驗方桔梗天冬黃芩葶藶子五分秦歸生甘草易易耳倘辨脈未清視為他病萬一肺腑能語則呼冤實屬可憐直待吐膿嘔血而後知焉則已晚矣士君子窮理於平日辨脈於臨時一遇內毒立剖當前誠有不必為之試黃豆而驗紅點者昔扁鵲視病窺見臟腑之微結留心脈學者安見古今不相及也矣癰疽一症迄我朝醫宗金鑑及證治全生等書出前代所不能醫者皆能醫之獨湧泉症不出前代論定千總劉蘭生童稚知交膠漆友也患是症流毒十有餘年未發之前卜其必發者驗其脈數也已發之後斷其不死者驗其脈緩也費盡千金總難全愈遊湘三年不知亦有人能醫否録之以志知己之感摘平脈三不治症論天下事之信以為然者必其理之無不然者也然僅言其常然而弗揭其偶然非惟無以堅其信或反益以滋其疑即如定緩為平脈是宜無病不瘳詎知噎膈反胃外不可治者又有三焉肌肉大脫九候雖調不可治者一也病到喘促脈忽還元不可治者二也全受而體無虧全歸而脈不變不可治者三也有理外之事便有理外之理第恐於理中之理未能洞悉無疑斯與理外之理愈覺昧沒而雜既於理外之理弗克明辨以晰遂於理中之理轉至惝恍無憑而緩為平脈之說不幾於捃托陳言究無主宰乎爰摘三條明著於編使知以緩為宗滴滴歸原允矣一經舊德漢書韋賢以詩書授七十餘為相少子元成復以明經歷位至丞相諺曰遺子黃金滿籯不如一經沈詮期詩一經傳舊德是編緩為平脈本內經舊德絲絲入扣森然五字長城唐書秦系與劉長卿善為詩賦權德輿曰長卿自以為五字長城系用偏師攻之雖老益壯丹鉛總録司馬景王命虞松作表再呈不可意鍾會取草為定五字松悅服以呈景王景王曰不當爾也松曰鍾會也景王曰如此可大用沈詮期詩五字擢英才用此事也解者以五字為詩誤矣死生章醫者所以治人之生者也未知死焉足以治人之生實知死之無可救藥則凡稍有一毫之生自宜多方調治欲辨死生仍歸緩字緩為一身之元氣即為一身之生氣有十分之緩即有十分之生有分毫之緩即有分毫之生聽緩之聲繪緩之象取緩之魂追緩之魄刺緩之骨縛緩之神而幽明異路如在目前彈石劈劈而又急解索散散而無聚問有分毫之緩乎曰無有也彈石之脈若堅硬之物擊於石上解索之脈猶解亂索指下乍疏乍密雀啄頓來而又住屋漏將絶而復起問有分毫之緩乎曰無有也雀啄之脈猶雀之啄食連連湊指且堅且鋭忽住忽來屋漏之脈良久一漏蝦游冉冉而進退難尋魚翔澄澄而遲疑掉尾猶有分毫之緩乎曰無有也脈已濡細矣加以十一二至滿指是脈猶蝦之擁於水中冉冉而進退難尋脈已沉矣加以兩息一至猶魚之在水中頭身貼然不動而尾良久一掉沸釜之脈湧如羹一占此脈旦夕死而緩全無餘影矣修到神仙也無藥世間何處覓醫生復有絶處逢生困頓沉沉聲音劣劣不患脈少而患脈多不息脈無而患脈有寸關雖無尺沉而勻病到無聊脈猶有根仔細栽培立可回春

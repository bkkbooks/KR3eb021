body:
  text: 卷一總論醫理無窮脈學難曉會心人一旦豁然全憑禪悟余未及冠因病棄儒留心醫學研究諸書並無一字之師獨於脈稍得異人指示提一緩字而融會之全身脈症於瞬息間盡歸三指之下距今四十餘年所過通都大邑探取病情無一不驗今不敢以自私立為主腦對以陰陽注釋多本古人體裁實非臆造就正同學幸其教我脈學源流軒轅使伶倫截嶰谷之竹作黃鐘律管以候天地之節氣使岐伯取氣口作脈以候人之動氣黃鐘之數九分氣口之數亦九分律管具而寸之數始形故脈之動也陽浮九分陰得一寸合於黃鐘黃鐘者氣之先兆能測天地之節候氣口者脈之要會能知人命之死生本律管以定脈軒岐之微蘊誠有未易窺測者越人著難經推明十變叔和撰脈經演成十卷而脈始得燦明於世迄五代高陽生脈訣出士大夫多議之由是才人傑士咸馳驟於筆墨之間各據其理各抒其見而真訣几几乎晦矣齊禇澄論脈女子陰逆自上生下左寸為受命之根心肺脈診於兩尺倒裝五臟謬妄已極趙維宗論脈心肺在上為浮為陽肝腎在下為沉為陰脾居中州半浮半沉半陰半陽意義膚淺更屬無稽吳草廬宗內經取之於氣口未盡內經之奧朱考享推內經求之於遍身未達內經之專若二李者瀕湖士材將前人所流傳之脈依樣畫葫蘆演成詩句字字曉暢叔和而後幸有傳人究未得平脈訣醫無權度殊失內經以平人定脈之旨是編揆之前哲雖則別開生面實亦不過發明內經及難經脈經之義云爾定脈部位晦庵朱子跋郭長陽醫書云豫嘗謂古人之於脈其察之固非一道矣然今世通行惟寸關尺之法為最要且其説具於難經之首篇則亦非憑空結撰也故郭公此書備載其悟而並取丁德用密排三指之法以釋之夫難經蔓乎尚已至於丁德用之法則余竊意診者之指有肥瘠病者之臂有長短以是相求或未為定論也蓋嘗考經之所以分尺寸者皆自關而前卻是則所謂關者必有一定之處亦若魚際尺澤之可以外見而先識也然考諸書皆無的論惟千金方內以為寸口之處其骨自高而關尺由是而卻取焉則其言之先後位之進退若與經文相合獨俗間所傳脈訣五七韻語其詞淺陋非叔和本書明甚乃能直指高骨為關而分其前後以為尺寸陰陽之位似得難經本旨余非精於道者不能有以正也姑附於此以俟明者而折衷焉按內經十八卷即三墳古書既未經孔子刪定復未經朱子集注醫喙爭鳴互相排詆分門別戶莫知適從獨指高骨為關以定尺寸得朱子之跋而脈之部位始得其準尺寸解高骨為關從關至魚際得一寸脈浮九分而寸以名從關至尺澤得一尺脈見一寸而尺以名以關為間隔而尺寸不得混為一家合寸關尺為三部其解最為直捷不得曲為分晰六部脈解六部之脈候之寸關尺出於脈要精微篇左寸以候心左關以候肝左尺以候腎右寸以候肺右關以候脾右尺以候命門以明六部各有所屬究之候脈分而不分不分而分則得訣矣脈經曰春弦夏洪秋似毛冬石依經分節氣婀婀緩若春楊柳此是脾家居四季假如春脈弦豈有肝脈弦而餘脈不弦之理乎弦則俱弦不過言春乃肝氣主事非謂獨候之左關但得浮洪即屬心火不必定拘左寸但得短澀即屬肺金不必定拘右寸但得沉細即屬腎水不必定拘左尺但得和緩即屬脾土不必定拘右關五臟之脈分五臟之部不分也是以傷寒之脈仲景一書曰浮曰緊曰長曰弦曰沉曰微曰伏曰代但統分脈之浮緊長弦沉微伏代並未專指何經內傷之脈叔和一書失血宜沉細不宜浮緊水症宜浮大不宜沉伏上氣宜浮滑不宜沉數腹痛宜沉伏不宜浮洪消渴宜數大不宜虛細咳嗽宜浮緩不宜細數但分脈之宜與不宜亦不必辨其何臟此其明白可證者也要須知先天一點真陽之火潛於水中寄居兩尺在右火用事水為之涵火生土是為脾土居右關土生金是為肺金居右寸在左水用事火為之溫水生木是為肝木居左關木生火是為心火居左寸自無而生有由下而生上各有其位而不可易者難經曰取寸口以訣五臟六腑之死生吉凶寸口者手太陰之動脈內經曰心脈滿大癇瘛筋攣肝脈小急癇瘛筋攣腎脈小急肝脈小急心脈小急不鼓皆為瘕腎肝並沉為石水並浮為風水此又於部分之間而別有會心者分而不分不分而分神而明之存乎其人左心膻中肝膽腎小腸右肺胸中脾胃命大腸辨天下之理有不必辨者有必欲辨者不必辨而辨則其理晦必欲辨而不辨則其理亦晦心與小腸相表裡肝與膽相表裡腎與膀胱相表裡肺與大腸相表裡脾與胃相表裡形質既已相配氣脈自然相通而以為大小腸之在下不得候之於上相為表裡則可同居其部則不可易為左心膻中肝膽腎小腸右肺胸中脾胃命大腸亦思氣類相感有不見其端倪者琥珀拾芥懸空亦起磁石吸鐵隔礙潛通而何論大小腸之在下心肺之在上也乎且胸中膻中間不能寸小腸丙火何得與腎水同居大腸庚金何得與命門同宿乎此則不必為之穿鑿而辨者也而有不得不辨者左腎以藏水右腎以藏火既已力辨其非何以兩腎俱藏水列諸左右獨候之左尺有是理乎不知兩腎皆藏水即皆藏火不過左以水為主右以火為主耳吾為之正其名曰左心小腸肝膽腎膀胱右肺大腸脾胃腎命門定至數持脈之初先看至數欲知至數先平己之呼吸以己之呼吸定人之呼吸未嘗不同蓋人之五臟不可見所可見者脈而已呼出於心肺心一至肺一至吸入於肝腎肝一至腎一至一呼一吸脈來四至名一息脾脈不見者以土旺於四季也是為平脈惟是邪擾於中斯脈不得其正耳亦有平人脈來五至而無病者二十七脈名目微細弦弱濡牢浮沉虛實滑澀洪伏緩遲數長短芤革結促緊散動代訣以緩為極平脈餘二十六為病脈定清緩脈方可定諸病脈精熟緩脈即可以知諸病脈脈之有緩猶權度之有定平星也緩和緩也張太素曰應指和緩往來甚勻楊元操曰如初春楊柳舞風之象四至調和百脈通渾涵元氣此身中消融宿疾千般苦保合先天一點紅露顆圓勻宜夜月柳條搖曳趁春風欲求極好為權度緩字醫家第一功不浮不沉恰在中取不遲不數正好四至欣欣然悠悠然洋洋然從容柔順圓淨分明微於緩者即為微細於緩者即為細虛實長短弦弱滑澀無不皆然至於芤革緊散濡牢洪伏促結動代以緩為權度尤其顯而易見者也有胃氣者生四時之脈和緩為宗緩即為有胃氣也萬物皆生於土久病而稍帶一緩字是為有胃氣其生可預卜耳統六脈而言不得獨診右關脈貴有神無病之脈不求神而神在緩即為有神也方書乃以有力訓之豈知有力未必遂為有神而有神正不定在有力精熟緩字自知所別裁讀緩字法焚香跌坐靜氣凝神將緩字口誦之心維之手摩之反復而詳玩之久之緩歸指上以此權度諸脈瞭如指掌四時平脈天地之氣分寄四時化生萬物故春木夏火秋金冬水皆乘其令以分司獨土則通旺於四季分陰分陽迭用柔剛蓋言平也人得天地之氣以生而脈即與之為比附春為肝木脈弦夏為心火脈洪秋為肺金脈毛冬為腎水脈石惟胃氣屬土其脈從容和緩散布於弦洪毛石以默運於春夏秋冬渾淪元氣流暢貫通生生不已平孰甚焉如春肝宜弦弦而緩者若風颭柳梢抑揚宛轉夏心宜洪洪而緩者若活火烹茶薰灼舒徐秋肺宜毛毛而緩者若揀金砂礫漸次披搜冬腎宜石石而緩者若水澤腹堅徐形皺透四季脾胃用事厥脈宜緩不問可知此平脈所以獲生也蓋平者和也所以和其脈使無急躁也平者準也所以準其脈使無偏勝也以緩平之而後四時之脈得其平耳夫緩即胃氣原秉天生地成與諸脈互相主輔而不可須臾離焉者經所云春弦夏洪秋毛冬石皆以胃氣為本誠得診脈之大宗也惜醫不知察囫圇讀過毫無心得未知有胃氣者為平為生無胃氣者為病為死遂使一成不易之理徒蓄千載莫破之疑余因揭而論定以著是編浮沉遲數四大綱立緩為標言平脈即統該乎弦洪毛石提病脈先分著於浮數遲沉而二十二脈之旁見側出者無不寓於其中舉其綱而目自見浮脈經曰舉之有餘按之不足崔氏曰如水上漂木主表浮從水面悟輕舟總被風寒先痛頭里病而浮精血脫藥非無效病難瘳浮緊傷寒浮虛傷暑浮數傷風浮遲傷濕亦有里病而浮者浮而云騰蜃起多屬陰虛浮而綿軟蔥空半由失血浮而月蕩星搖預知精敗浮而羽鎩毛散可卜神消沉脈經曰重手按至筋骨乃得楊氏曰如石沉水底主裡沉居筋骨有無疴著骨推筋仔細摩有病而沉兼別脈沉而無病世人多沉遲痼冷沉數內熱沉滑痰積沉緊冷痛多有無病脈沉者沉居命脈悠長足徵壽考沉居腎脈恬靜咸頌仁人沉居關脈調勻允稱秀士沉居寸脈圓活定是名姝遲脈經曰一息三至去來極慢遲為陽不勝陰脈來不及遲惟三至欲亡陽好與醫家仔細詳總是沉寒侵臟腑只宜溫藥不宜涼浮遲表寒沉遲裡寒有力積寒無力虛寒未有無寒脈遲者遲為內病壅閼溫養陽剛遲為外病浸凌溫消陰翳遲為緩病纏綿溫補元氣遲為急病馳驟溫散客邪數脈經曰一息常數六至素問曰脈流薄疾數為陰不勝陽數脈為陽至倍三脈中數脈實難諳而今始識諸般數囑咐醫人莫亂探五行之中金木水土各居其一惟火則有二而推其火之類不特本經之火海枯被火則為腎火榆能生火則為肝火石可取火則為肺火壤內藏火則為脾火不止有二而有六矣而充其火之盡不特當時之火風熱而熾則為風火寒鬱而熱則為寒火暑傷而溫則為暑火濕積而蒸則為濕火燥過而枯則為燥火是內有六外亦有六矣而窮其火之變不獨五運六氣之火又有無根之火痰結之火血燥之火莫可名狀莫可紀極之火綜此以觀無病不有火無火不脈數無藥不可以治數君火而數芩連固為折火之正敵相火而數桂附亦為歸火之靈丹脾倦生火數非參耆莫療肝盛生火數惟柴芍可除數緣腎虛兩地滋陰不必降火數由肺損二冬泄熱即以清金解痰火之數惟恃法夏潤血燥之數須用當歸傷風發熱可以去風即可以治數防風羌活傷寒發熱於焉去寒即於焉治數麻黃桂枝療暑熱之數脈焦朮川烏極為妙品調濕熱之數脈蒼朮黃柏實有神功阿膠養秋燥之金脈數自減元參泄無根之火脈數以除區別內外分析經絡以脈證病以病證脈斯得之矣安得有心人與之談數脈哉對待總論人之一身不離陰陽而見之於脈亦不離陰陽浮沉遲數陰陽相配之大者也舉其餘而對待訓之事以相形而易明理以對勘而互見微與細對微為陽弱欲絶細乃陰虛至極二脈實醫家剖別陰陽關鍵最宜分曉故繼浮沉遲數後舉以為對以冠諸脈微微脈有如無難容一吸呼陽微將欲絶峻補莫踟蹰輕診猶見重按全無黃耆白朮益氣歸元附片乾薑回陽反本細細脈一絲牽餘音不絶然真陰將失守加數斷難痊舉之極微按之不絶天麥二冬清金生水生熟兩地滋陰養陽虛與實對二脈舉按皆得而剛柔異質實為邪氣實虛乃本氣虛虛虛脈大而鬆遲柔力少充多因傷暑毒亦或血虛空遲大而軟按之無力按脈經言隱指豁空非是諸脈中惟芤革二脈言空以虛脈而言空能別乎革難別乎芤瀕湖曰脈虛身熱為傷暑亦主血虛實實脈大而圓依稀隱帶弦三焦由熱鬱夜靜語猶顛浮沉皆得長大帶弦按脈經言應指幅幅然非是幅幅堅實貌乃牢緊脈非實脈也傷寒胃實譫語或傷食氣痛長與短對寸關尺為脈本位長則過乎本位短則不及本位欲辨長短先明本位長長脈怕繩牽柔和乃十全迢迢過本位氣理病將痊按長而牽繩陽明熱鬱長而柔和病將解矣朱氏曰不大不小迢迢自君言平脈也經曰心脈長神強氣壯腎脈長蒂固根深短短脈部無餘猶疑動宛如酒傷神欲散食宿氣難舒按短與動為鄰形與動實別動則圓轉如豆短則濡滯而艱瀕湖曰短而滑數酒傷神楊氏曰短脈為陰中伏陽三焦氣壅宿食不消弦與弱對脈而弦脈之有力者也雄姿猛態可以舉百鈞脈而弱脈之無力也纖質柔容不能舉一羽同一弦也在肝經則瀉之攻之在膽經則和之解之弦弦脈似張弓肝經並膽宮疝㿗癥瘕瘧象與傷寒同素問曰脈端直以長刊誤曰從中直過挺然指下按弦屬肝膽經疝㿗癥瘕瘧肝膽經病肝膽經有泄無補弱弱脈按來柔柔沉不見浮形枯精自減急治可全瘳脈經曰極軟而沉按之乃得舉手無有弱宜分滑澀脈弱以滑是有胃氣清秀人多有此脈脈弱而澀是為病脈滑與澀對脈之往來一則流利一則艱滯滑澀形狀對面看來便見滑滑脈走如珠往來極流利氣虛多生痰女得反為吉沈薇垣曰滑主痰飲浮滑風痰沉滑食痰滑數痰火亦有嘔吐蓄血宿食而脈滑者萬氏云脈尺數關滑而寸盛為有胎澀澀脈往來艱參差應指端只緣精血少時熱或純寒脈經云澀脈細而遲往來艱短而散或一止復來素問云參伍不調按血不流通故脈往來艱滯芤與革對同一中空而虛實分焉虛而空者為芤實而空者為革悟透實與虛旁通芤與革芤芤字訓慈蔥中央總是空醫家持擬脈血脫滿江紅戴同父曰營行脈中脈與血為形芤脈中空血脫之象也革革脈惟旁實形同按鼓皮勞傷神恍惚夢破五更遺按革主亡精芤主亡血脈經言均為失血之候混淆莫別不過革亦有亡血者緊與散對鬆緊聚散物理之常散即松之極者也緊即聚之極者也緊如轉索散似飛花緊散相反形容如生緊緊脈彈人手形如轉索然熱為寒所束溫散藥居先諸緊為寒為痛人迎緊甚傷於寒氣口緊甚傷於食腹痛尺緊中惡浮緊咳嗽沉緊皆主死症按浮緊宜散沉緊宜溫散散脈最難醫本離少所依往來至無定一片楊花飛柳氏云無統紀無拘束至數不齊或來多去少或去多來少渙散不收濡與牢對浮之輕者為濡平沙面雨霏千點沉之重者為牢錦匣里綿裹一針濡濡脈按須輕萍浮水面生平人多損壽莫作病人評脈經曰濡脈極軟而浮如帛在水中輕手乃得按之無有按濡主血虛之病又主傷濕平人不宜見此脈瀕湖曰平人若見似無根牢牢脈實而堅常居沉伏邊疝㿗猶可治失血命難延脈經曰似沉似伏實大弦長仲景曰寒則牢堅有牢固之象按牢長屬肝疝㿗肝病實病見實脈可治扁鵲曰失血脈脈宜沉細反浮大而牢者死虛病見實脈也洪與伏對浮之最著者為洪水面上波翻浪湧沉之至隱者為伏石腳下迹遁蹤潛洪洪脈脹兼嘔陰虛火上浮應時惟夏月來盛去悠悠經曰諸腹脹大皆屬於熱嘔初起為寒鬱則為熱經曰諸逆上衝皆屬於火陰虛陽盛脈多洪惟夏日應時瀕湖曰拍拍而浮是洪脈素問曰來盛去衰伏伏脈症宜分傷寒釀汗深浮沉俱不得著骨始能尋傷寒一手伏曰單伏兩手伏曰雙伏乃火邪內郁不得發越陽極似陰故脈伏必大汗而解又有夾陰傷寒先有伏陰在內外復感寒陰盛陽衰四肢厥逆六脈沉伏須投薑附灸關元脈乃出按二症極宜分結與促對遲而一止為結數而一止為促遲為寒結則寒之極矣數為熱促則熱之至矣結結脈遲中止陽微一片寒諸般陰積症溫補或平安越人曰結甚則積甚結微則積微浮結內有積病沉結內有積聚促促脈形同數須從一止看陰衰陽獨甚泄熱只宜寒瀕湖曰三焦鬱火炎炎盛進必無生退有生按促只宜泄熱除蒸誤用溫補立見危殆動與代對動則獨勝為陽代則中止為陰動代變遷陰陽迭見動動脈陰陽搏專司痛與驚當關一豆轉尺寸不分明脈經曰動乃數脈見於關上下無頭無尾如豆大厥厥動搖仲景曰陰陽相搏名曰動陽動則汗出陰動則發熱瀕湖曰動脈專司痛與驚汗因陽動熱因陰代代脈動中看遲遲止復還平人多不利惟有養胎間結促止無常數或二動一止或三五動一止即來代脈之止有常數必依數而止還入尺中良久方來滑伯仁曰若無病羸瘦脈代者危有病而氣不能續者代為病脈傷寒心悸脈代者復脈湯主之妊娠脈代者其胎百日代之生死不可不辨奇經八脈本來督任一身中尋得仙源有路通剖別陰陽維蹺界調沖運帶鼎爐紅八脈者督脈任脈陽維陰維陽蹺陰蹺衝脈帶脈是也以其不拘於經故曰奇督任衝起於會陰穴一源而三脈督脈由長強穴貫脊上行過巔頂至齦交而止為陽脈之總督故曰陽脈之海任脈上行臍腹過咽喉至承漿而止為陰脈之承任故曰陰脈之海陽維起於諸陽之會由外踝之金門穴而上行於衛分陰維起於諸陰之會由內踝之築賓穴而上行於營分夫人身之經絡繁密二脈能於陰交陽會之間加一緊縛舉綱齊目而陰陽斯得維持之力陽蹺之脈起於足跟循外踝上行於身之左右陰蹺之脈起於足跟循內踝上行於身之左右所以使機關之蹺捷也衝脈前行於腹後行於背上行於頭下行於足凡筋骨脾肉無處不到十二經絡上下之衝要故曰十二經絡之海帶脈橫圍於腰狀如束帶所以總束諸脈醫家知乎八脈則十二經十五絡之旨得矣修煉家知乎八脈則龍虎升降開牝幽微之竅妙於此入其門矣養生者無事之暇撮起督脈循尾閭夾脊雙關上行腦頂下通乎任循環無端終而復始久久調息二脈貫通如一脈矣人身元陽之氣自下而生者亦自下而竭督任相聯轉運不已有其生之斷難竭之而壽有不穩固者乎鹿顧尾閭能通督脈龜納鼻息能通任脈二物俱得長壽有明徵矣提督而上行也陰陽維蹺隨督而升通任而下行也陰陽維蹺隨任而降一升一降陰陽維蹺亦得為之疏暢由是從會陰穴起上至天下至淵所以運其沖也從季肋穴起左轉三十六右回三十六所以運其帶也第見營衛和而顏色日以滋潤機關利而手足日以輕捷三百六十骨節節節光瑩八萬四千毛竅竅竅亨通血不蹇澀氣不停滯六淫不得而干之七情不得而傷之卻病延年之方未有過於此者何必採商山之芝貯盤銅之露而後永其壽乎從知紫府長生訣盡在奇經八脈中參同契曰北方河車即此法也循而習之疏經暢脈可以養生進而求之還精攝氣可以延年神而明之進火退符可以奪丹仙經所傳抽鉛添汞降龍伏虎擒鳥捉兔霏雪産蓮無不寓於其中淺者得之為淺深者得之為深臟腑説人身一太極也靜而生陰則為五臟動而生陽則為五腑一動一靜互為其根吸門內氣管所繫手太陰肺手少陰心居於膈上足太陰脾足厥陰肝足少陰腎居於腹下臟數五其形象地靜而得方食管所繫足陽明胃手太陽小腸手陽明大腸一路貫通足太陽膀胱有下口而無上口足少陽膽有上口而無下口兩腑對照腑數五其氣象天動而行健手少陽三焦手厥陰心包絡有經無形以五臟位置言離為心火居南坎為腎水居北坤為脾土居中肝不全居左而震為肝木居左氣自行於左肺本不居右而兌為肺金居右氣自行於右以五腑位置言初以胃統納水穀次以小腸分清水穀於是大腸消其谷膀胱滲其水膽則司其事以陰陽匹配言心與小腸合丁丙共宗肺與大腸合辛庚一本脾與胃合己戊伴居肝與膽合乙甲同體腎與膀胱合癸壬並源包絡與三焦合營衛相親以陰陽交媾言三陰從天降手太陰肺手少陰心手厥陰心包絡列之於上三陽從地升手陽明大腸手太陽小腸手少陽三焦列之於下其中脾陰胃陽肝陰膽陽腎陰膀胱陽更迭相濟以臟腑經絡言手之三陰從胸走手手太陰肺從中府而走手大指之少商手少陰心從極泉而走小指之少衝手厥陰心包絡從天泉而走中指之中衝手之三陽從手走頭手陽明大腸從手大指商陽而走頭之迎香手太陽小腸從手小指而走頭之聽宮手少陽三焦從手四指關衝而走頭之絲竹所以肺心包絡大小腸三焦皆稱之曰手足之三陽從頭走足足太陽膀胱從頭睛明而走足小指之至陰足陽明胃從頭頭維而走足次指之厲兌足少陽膽從頭童子髎而走足四指之竅陰足之三陰從足走腹足太陰脾從足大指隱白而走腹之大包足少陰腎從足心湧泉而走腹之俞府足厥陰肝從足大指大敦而走腹之期門所以膀胱胃膽脾腎肝皆稱之曰足以陰陽多少言太陰太陽為正少陰少陽次之厥陰陰盡也陽明並左右之陽兩陽合明也又次之本王啓元內經注肺脾得正陰之氣以太陰稱心腎屬少陰包絡與肝則厥陰矣受陰氣以是為差膀胱小腸得正陽之氣以太陽稱三焦與膽屬少陽胃與大腸則陽明矣受陽氣以是為差以臟腑功用言主宰一身者心而小腸為受盛之官宣布萬事者肺而大腸為傳導之官謀勝千里者肝而膽為決斷之官頤養四體者脾而胃為倉廩之官精貫百骸者腎而膀胱為津液之官三焦為氣之父包絡為血之母夫一臟一腑五臟而稱六腑者以三焦屬腑故言六腑然三焦屬腑而稱六腑包絡屬臟宜亦可稱六臟由斯而論言六腑必言六臟言五臟只可言五腑以合天地之數何必參差其説而言五臟六腑哉縷陳臟腑燦然可考而有不離乎臟腑亦不雜乎臟腑非形象之可繪言語之可傳者妙在元關一竅命門提要詳後論中人身以命門為本而論命門者不一其處為此坎為水一言盡之蓋坎陰包乎陽一言水而火在其中如必象坎之形兩邊一畫為陰中間一畫為陽則拘矣獨不聞畫前原有易乎三焦辨難經注三焦一則曰有名無形與手厥陰相表裡再則曰有名無形其經屬手少陽詞旨極為明白叔和定脈經因之以立論可謂善於祖述矣辨脈訣者不求甚解以為明有其經又曰無其形自相矛盾為此不經之談而有為之原者脈訣出於六朝高陽生假名偽撰叔和脈經中決不為此語不知叔和實根於難經脈訣亦未背乎叔和辨之者憒憒而辨原之者亦冥冥而原讀難經者將三焦對諸臟腑讀之渙然冰釋矣腎之形如豇豆而三焦之形何似脾之形如馬蹄而三焦之形何類心之形如蓮苞而三焦之形何若肺六葉而形如華蓋肝七葉而形如甲拆三焦亦有葉可數形可擬乎五臟無不皆然經則起於關衝終於絲竹凡二十三穴左右四十六穴豈不有名無形而行經於上中下乎究其源濫觴於宋儒將高陽生一闢龐安常倡其端而指其瑕戴同父和其説而辨其謬厥後一派名流俱以耳讀書而不以心讀書凡脈訣之本於靈素難經微詞奧旨有難曉者概歸於高陽生之僭擬高陽生陽受其貶陰實受其褒夫高陽生立七表八里九道之目而遺數脈其罪實無可逃其餘不過文不雅訓薦紳先生難言之而乃於詞之曉暢者亦謂高陽生杜撰高陽生不應受如是之誣學未深造而輕議古人多見其不知量也考三焦之功用乃人身最關要之腑如天地之三元總領五臟六腑營衛經絡之氣而為諸氣之宗以其資生於腎與腎合氣腎為元氣之正三焦為元氣之別並命門而居候脈者亦候之右尺可謂深知經脈者余謂不然上焦主內而不出其治為膻中中焦主腐熟水穀其治在臍旁下焦主出而不內其治在臍下一寸既平列上中下三焦候脈自宜候寸關尺三部心包絡辨靈蘭祕典稱心為君主二十五難稱包絡為心主蓋心主有形之君包絡是無形之主柱下史云常有欲以觀其徼常無欲以觀其妙徼如遊徼之徼中邊洞徹無所不周惟朕兆甫萌端倪乍露乃能灼見其真故必於常有時觀之妙如元妙之妙宇宙洪荒無所不包惟機關未啓意念未興始可洞徹其質故必於常無時觀之亦倣佛無名天下之始有名萬物之母之言後世梁王份對高祖曰陛下應萬物為有體至理為無蓋暗合此意耳是也宋元脈訣不知仿自何人因包絡動則喜笑不止與十二官內膻中喜樂出焉相吻合遂以包絡即膻中亦思膻中為臣使之官君臣大義名分森然何以止知讀下一句而不知讀上一句乎且將包絡繪其圖於簡編獨不聞心主與三焦相表裡俱有名無形何以能知著脈訣而不知讀難經乎包絡之經雖起膻中以無職統衆職尊卑原是攸分心有形心主無形天下惟無形者其用最神所以君主無為心主用事空空洞洞之中天至地八萬四千里空空洞洞人心至腎八寸四分空空洞洞總視心主何如耳心主泰然志氣日以清明義理日以昭著仰無所局於天之高俯無所蹐於地之厚率性而行夢寐亦形其暢適於以想見簞瓢陋巷之回春風沂水之點焉心主憒然物欲莫辭其憧擾精神莫定其從違未嘗臨深而若臨淵將隕未嘗登高而若登山將崩任情而動宴安亦露其張皇於以想見因石據藜之象噍殺嘽緩之音焉余用是而知天地之道其猶橐籥乎無底曰橐有竅曰籥中間一竅無人摸著指心包絡也解悟此竅璇璣立躋天仙地位其候脈也菩提本無樹明鏡亦非臺傳燈録五祖宏忍大師欲求法嗣令寺僧各述一偈時有上座神秀者衆所宗仰於壁上書曰身是菩提樹心如明鏡臺時時勤拂拭莫使惹塵埃六祖慧能時為行者聞之則曰芙則美矣了則未了至夜潛書一偈於秀偈旁曰菩提本無樹明鏡亦非臺本來無一物何處惹塵埃五祖見之嗣遂定有非靈素難經之所及者請讀無字之經梵典南土遺使詣西竺取經國王將經祕函給使者還至中途開視書中並無一字因復至西竺國王笑曰吾念南土至誠不憚跋涉故將上乘無字經給發豈知止知讀有字之經不知讀無字之經故南土所傳皆有字下乘經反關脈解寸口為脈之大會診家於此候吉凶死生間有脈不行於寸口由肺列缺穴斜刺臂側入大腸陽溪穴而上食指者名曰反關非絶無僅有之脈也人一小天地也盍觀於天乎日至為天之大經七政為緯七政日月五星也二十八宿左轉為經七政右旋而行為緯周行於天而遲留伏逆凌犯交食五星與日三合會則遲與日對衝或與日隔宮遇則留與日同度則伏逆亦在對衝隔宮凡星不循常度亂入次舍為凌犯交食即日月蝕也甘石氏古之掌天文之官如周禮馮相保章之類可得而推之若夫數應謫見偏無侵蝕之愆禮記陽教不修謫見於天日為之食陰教不修謫見於天月為之食食即相侵相蝕也數應然而竟不然者或有他善之舉以宥其小懲或有悔禍之機以俟其速改抑勢之巧中共偶耳官設眂祲果驗宿離之忒周禮眂祲掌十輝之法以觀妖祥辨吉凶若陰陽變為祲赤烏成象鐫而橫刺監而抱珥蔽而晝暗蒙而光瞢白虹彌貫雲氣敘列朝隮日上雜氣可想月令宿離不貸宿星躔之離星過舍貸與忒同設官如是而天象如是者抑勢之會逢其適耳與夫景客孛彗景星德星也太平之世則景星見又天官書天晴則景星見客星無常次漢書子陵與光武共臥以足加帝腹次日太史奏客星犯御座孛彗妖星也春秋昭十七年冬有孛星入於大辰注孛孛星也爾雅彗星為攙搶注亦謂之孛又漢書文穎注孛星光芒短其光四出蓬蓬孛孛也彗星光芒長參參如掃彗也二星似少異徵休徵咎應時而見則勢之適然者甘石氏雖然洞悉其微而究莫能彌縫其闕又不觀於地乎東向為水之大會決汝漢而排淮泗順其性而導之因其壅而疏之禹之行其所無事也至若弱水入於流沙反為導水之始黑水入於南海實據東流之先雖禹亦不得強使之東但得安瀾有慶亦不必定歸之於東矣人得天地之氣以生脈會於寸口者得天地之正者也脈反其關者得天地之偏也然偏也非病也均之得氣以生也其三部定位於寸口無異七表八里九道三餘脈辨浮沉遲數脈之綱領素問脈經皆為正脈脈訣立七表八里九道之目而遺數脈不辨而知其不可宗然體裁既變乎古而明其謬意義自當分析於今而折其衷天地未闢老陰老陽用事天地既闢少陰少陽用事少陽之數七七主天天有七政居地之表少陰之數八八主地地有八極淮南子九州之外乃有八寅八寅之外乃有八紘八紘之外乃有八極居天之裡陽常有餘陰常不足天包乎地男強於女牡健於牝雄矯子雌經曰能知七損八益則足以治病者此也天地之數始於一而終於九故天有九天九星九道之名九星即貪狼且門祿存文曲廉貞武曲破軍左輔右弼九道青道二白道二赤道二黑道二合黃道而為九也九天周子一為宗動天二為恆天以下七政各一重天又太元經一中天二羡天三從天四更天五粹天六廓天七減天八沈天九成天地則有九州九野九河之號黃帝因天之象以畫地之形廣輪錯綜無少畸零易曰地道無成而代有終其是之謂乎期三百有六旬有六日合氣盈朔虛以置閨而後歲功成焉人一小天地也七表以法天八里以法地九道以法天地之九數補三脈以象歸奇之閏脈訣分類之義想當然耳今舉為對待配以陰陽一物不離乎陰陽以陰陽該之而七表八里九道餘三無不寓於其中以俟千秋百歲自有論定之者七診辨脈經曰七診者一靜其心存其神也二忘外意無思慮也三均呼吸定其氣也四輕指於皮膚之間探其腑脈也五稍重指於肌肉之際取其胃氣也六再重指於骨上取其臟脈也七詳察脈之往來也據脈經所説指臨時言以余訣之用功不在臨時而在平時平居一室之中內以養己恬靜虛無一存其神二忘其慮三均其呼吸沉潛於脈理之場從容於脈理之圃將心所存之神意所忘之慮鼻所出入之呼吸盡附指頭不以心所存之神為存而以指所存之神為存不以意所忘之慮為忘而以指所忘之慮為忘不以鼻所出入之呼吸為呼吸而以指所出入之呼吸為呼吸以之探臟腑取胃氣察脈之往來無論燕居間暇即造次之時顛沛之際得之於手應之於心矣蓋手中有脈而後可以診他人之脈若平時未及揣摩徒事口耳之學臨時從七診分晰心中了了指下難明況醫常倉卒病值危急又何以盡七診之法而一無遺漏也乎九候解寸關尺為三部一部各有浮中沉三候輕手得之曰舉候浮脈也重手取之曰按候沉脈也不輕不重委屈求之曰尋候中脈也三而三之為九也浮以候表頭面皮毛外感之病也沉以候里臟腑骨髓內傷之病也中以候中中者無過不及非表非里至數從容無病可議古帝王傳心之要所為以一中括天地之道而立斯人身心性命之宗者此也古人以之為心傳吾人亦以之徵心得蓋中與和通謂其和緩而不鄰於躁也中與庸近謂其平庸而不涉於偏也其見諸脈胃氣居中則生機之應也定之以中而浮沉朗若觀火三部九候無不了然膻中解兩乳中間氣聚之海名曰膻中無經絡而有其官經曰膻中者臣使之官喜樂出焉余讀經文而穆然思恍然悟人自墜地以來未逢笑口先試啼聲知識甫開端倪迸露漸漸客氣侵淫本來流動充滿之氣無復中存百歲光陰總是牽愁之歲月半生閲歷哪尋極樂之寰區所以生病老死苦不能脫其輪回矣如是我聞觀自在菩薩心平氣和理直氣壯慈燈普照王勃普悲寺碑宣佛鏡於無方演慈燈於已絶統五蘊以俱空涅槃經五蘊胥空即六入之類智炬長明梁簡文帝菩提樹頌序智燈智炬之光照虛空於莫限馭十方而胥淨唐太宗聖教序宏濟萬品典御十方破煩惱網以慧劍維摩經以智慧劍破煩惱網生安穩想於化城法華經法華道師於險道中化作一城疲極之衆生安穩想廣大乾坤逍遙世界舒長日月容納須彌維摩詰經以須彌之高廣納芥子中而不迫窄崑崙山西方曰須彌山若夫情根不斷憾種難翻荊棘叢中無非苦戚葛藟藤里絶少安間鼻觀壅木樨之香羅湖野録黃魯直從晦堂和尚遊時暑退涼生秋香滿院晦堂曰聞木樨香乎公曰聞晦堂曰吾無隱乎爾公欣然領解心期迷梅子之熟傳燈録大梅和尚曰任汝非心非佛我只管即心即佛馬祖曰梅子熟也杳無妙葉梁簡文帝元圃講頌樹葳蕤於妙葉哪發空花葉昭明太子詩意樹發空花然則滌偏氣於往來高懸明鏡涵元氣於夙夜永保靈犀義山詩心有靈犀一點通云蕊函開便為清福之地月苗杯舉別有浩洞之天陸龜蒙道室詩月苗杯舉有三洞云蕊函開叩九章克效臣使之司允稱喜樂之國丹田解臍下有丹田有活見之處而不可以分寸計人之動氣根於兩腎生於丹田氣足內藏鼻息微細氣虛上奔鼻息喘促無氣有氣有氣無氣以此為辨而名為丹田者則非醫家所能通曉余與梯云道人姓謝字際洛新化人甫八歲病狂所言皆蓬萊海島之事十四歲方瘳十五歲發蒙越明年遊泮一動一靜無不以聖賢自規了悟山人姓劉諱宗因字群占號濟南邵陽人天生一種慈詳愷惻之性日以普渡衆生為念鬢髮雪白滿面紅光夢覺道人遊湘寄書未至預對家人白之有可知息息相通處未見瑤函先見形之句同考道於梅城雷公洞在城南九十里洞窈而深巨石摩霄塞口一水衝破夢覺道人循口壁鑿開為新邵通衢約一里許正居洞中間傍溪獻一大岩生成考道之所基砥而塏爽頂鍋而風藏門面奇花異草四時馣𩡣壁腳方床圓幾百竅玲瓏不寒不暑常在二八月天氣有爐有灶包含億萬劫金光忽一朝謝子微笑曰吾今知臍下為丹田乃藏丹之所也昨宵漏永寶鼎濃濃光透簾幃奪得金精一點恍兮惚兮活見於臍下矣余曰水中之鉛經火一煉化而為丹些子機關只可自知余亦將有得不堪持贈君爾時劉子猶未悟也謝子靈根夙植仙骨珊珊雅有逸鶴間鷗之致聞道獨早三人參究原理得益於謝者居多厥後劉亦勇於上進一痕曉月東方露坎戊月精曉月露者藥苗生也窮取生身未有時天地未有時先有貞元會合之真氣而後有天地生身未有時先有貞元會合之真氣而後有生身曉月露追取先有之真氣歸於生身其所得更有過於余與謝者桃花夙有約同泛武陵槎陶淵明桃花源記武陵人捕魚為業緣溪而行忘路之遠近忽逢桃花夾岸數百步中無雜樹行到源頭山有小口倣佛若有光舍船從口入其中往來種作男女衣裳悉如外人黃髮垂髫怡然自樂自云先世避秦人亂來此絶境不復出焉遂與外人間隔人迎氣口解左手關前一分為人迎右手關前一分為氣口脈經曰人迎緊盛傷於風寒氣口緊盛傷於飲食夫前一分即左右寸也左寸本以候心心非受風寒之所而以為緊盛傷於風寒右寸本以候肺肺非積飲食之區而以為緊盛傷於飲食輾轉思維不得其解乃今於天地運行而知之矣天左旋風寒為天之邪人迎之而病邪氛脅逼畏風惡寒亦見於左之上部地無旋地之氣右旋人身之氣亦從右始是以右之上部不名寸口而名氣口一部各分天地人三候上部之地屬陽明胃經主消納五穀內傷飲食亦先見於右之上部以其本位而言則曰心與肺以其受邪而言則曰人迎氣口衝陽太衝太溪解人之兩手為見脈之所而不知兩足尤為樹脈之根衝陽動脈在足胕上五寸陷中屬陽明胃經太衝動脈在足大指本節後三寸陷中屬厥陰肝經太溪動脈在足踝後跟骨間屬少陰腎經病當危殆寸關尺三部俱無須向三脈診之如往來息均尚有可生之路試觀小兒二三歲時好赤足八歲好趨十歲好走陽氣從下而生也五十足漸畏冷六十步履維艱陽氣從下而耗也兩足無脈縱兩手無恙其命不能久留兩手無脈而兩足有脈調治得宜亦可挽轉生機一心應變宏敷濟衆之仁萬象回春允副好生之德

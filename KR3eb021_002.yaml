body:
  text: 卷二男女尺脈異論男女異質尺脈攸分卜壽夭於目前溫犀易辨晉書溫嶠過牛渚磯深不可測遂燃犀角照之須臾見水族奇形異狀或乘車馬著赤衣者嶠至夜夢人謂日與君幽明相隔何若乃爾定榮枯於指下秦鏡難逃西京雜記秦始皇有方鏡照見心膽男脈尺藏抱朴守真德壽之耇歸神斂氣福祿之翁若浮洪而短其禍有不可勝言者碌碌蓬廬終日待株林之兔列子野人有遇一兔走觸株林而死輒拾以歸其後守株以待兔悠悠歲月無路看長安之花孟郊詩春風得意馬蹄疾一日看盡長安花而且每多斯疾之呼膏肓莫治定有夫人之慟命數難延女脈尺盛雅秀彬彬芝香玉砌精光炯炯桃熟瑤池若隱伏而微其禍又不可勝言者郊禖無靈空履大人之跡螟蛉有子徒聞象我之聲而且獅子吼於河東乞憐處士東坡集陳季常佞佛妻柳氏性悍客至常聞垢聲東坡戲之曰龍邱居士亦可憐談空說法夜不眠忽聞河東獅子吼拄杖落手心茫然按獅子吼梵書名佛聲震小說自息猶獅子吼群獸皆藏犢車乘於洛邑見戲相臣妬記洛中王導妻曹夫人性妬導憚之乃別營館居妾夫人知之率婢持刀尋討導恐飛轡出門左手攀車欄右手提塵尾以柄打牛司徒蔡謨戲曰朝廷欲加公九錫導弗之覺但謙退而已謨曰不聞余物惟有短轅犢車長柄塵尾導大怒癆症脈數論病症最苦者莫如癆脈經注脈數不治而未注明所以脈數所以不可治之故天一生水天一奇數陽也而生水則為陰矣陰陽同宮是一是二解人當自分明難經注左腎以藏水右腎以藏命門固為傳寫之訛即方書謂兩腎一般無二樣中間一點是元陽亦是隔膜之談蓋陰生於陽陽藏於陰誠有分之而無可分者人自㘞地一聲以來有此水即隱此火而窮通壽夭皆決之於此入藥鏡云崔公希範著惟有水鄉一味鉛是也乾坤交媾罷破乾為離破坤為坎鉛為金丹之母八石之祖先天一點乾金走入坎水中化而為鉛由乾陽來是為真火水足而火之藏於水中者韜光匿採而六脈得以平和水虛而火之見於水中者煥彩閃光而六脈何能安靜水之包涵乎火夫固有一滴之不可虧者病而名癆癆者牢也牢固難解之辭也或曰取其勞苦勞役勞頓之義吾則曰勞字從火相火一煽君火隨之而熾二火爭焰而癆焉蓋一勺之水煎熬殆盡火無所附麗飛越於上犯營則逼血妄行剋金則咳嗽不已灼津液則飲食變為痰涎蝕肌肉則形骸為之骨立一身之內純是火為之猖獗脈之所以數也精竭神枯脈之所以細而數也夫性命之理至為微妙性藏於心命藏於腎命即指此火也有水火可以引之歸元無水火亦無所歸宿龍雷之火潛於水中得溫暖則藏水冷則火升咽痛唇裂口渴面赤投以桂附溫其窟宅而招之火自歸乎原位本草所以有能此引火歸原之語世醫不察概施之無水並邪火之症人之死於非命者無冤可訴揆厥由來禍肇於景嶽醫貫薛氏醫案諸書流毒二百餘年天心仁愛斯民亦有悔禍之機自慎疾芻言醫學匯參書出而吳越之風息自如是我聞喚醒世人書出而燕趙之風息惟荊楚何辜此風猶自盛行直至焰消灰盡命亦於此盡失其可治乎其不可治乎惟願同學君子遇症之自內出者稍見脈過其止即以醇靜甘寒之品養之百合熟地枇杷葉梨汁童便麥冬桑皮地骨皮之類經驗加味地黃湯熟地淮藥棗皮澤瀉雲苓生地黃麥冬丹皮百合固金湯生地熟地百合麥冬芍藥秦歸貝母元參桔梗甘草無使至於數也誠濟世之慈航也然則問此火離乎本位出沒無端隱顯莫測可確指其僑寓於何處乎余應之曰分明香在梅花上尋到梅花香又無拈花示衆余著是稿殊觸當日隱憾也年十三應童子試見賞宗工曾拔前茅旅館風霜歸患水腫誤服桂附幾瀕於危忽江西來一老醫姓聶名廣達以乳蒸黃連服之而愈究中桂附傷隨即吐血咳嗽潮熱等症作矣一室之中調養五載博採醫書折衷一是惟日服甘寒之品身體漸次復元醫亦稍得門徑本欲理吾舊業以紹箕裘而且夜求治者接踵攪心因將手澤庋之高閣逮尋五十年前夢雲散天空一道人噎膈反胃脈緩論余得一緩字訣以決病之死生吉凶凡遇噎膈反胃脈未有不緩者其將何以決之余用是三思焉因其脈之緩而知其脾無恙焉腎無恙焉心肝肺無恙焉惟是一眚之纍居於要地遂積成莫療之疴即其脈以思其症繩以理而溯其源經曰金木者生成之終始河圖天一生水地二生火即乾元大生坤元廣生之綱領故水火之功用亦足以維繫乎天象地輿至土以五十居中寄旺於四時尤其彰明較著者惟天三生甲木地八乙成之乃滋生之始事所謂一生二二生三三生萬物者此也地四生辛金天九庚成之乃集成之終事所謂戰乎乾勞乎坎成言乎艮者此也故木氣司權豐草緑縟而爭茂佳術蔥龍而可悅金氣司權草拂之而色變木遭之而葉脫物之化從乎生物之成從乎殺生殺之機猶權衡之不可輕重也人生百年一大春秋耳年當杖鄉杖國正值秋月之天由是陽明之庚金其氣化為燥由下衝上衝於闌門幽門謂之反胃朝食暮吐或隔宿方吐衝於賁門謂之膈即食即吐衝於吸門謂之噎食難下咽燥之所沖門遂為之枯槁葉黃禾熟之候縱日暄風動露滋雨潤而欲轉其青焉抑已難矣經曰三陽結手陽明大腸足太陽膀胱手太陽小腸謂之膈不獨指陽明經亦思三陽同居下位豈有一陽結陽明金燥而二陽不隨之而結者乎膀胱與小腸津液隨之而枯所以吐沫刺痛羊糞總由於燥結然耳東垣通幽湯秦歸身升麻桃仁紅花炙草一錢生地熟地五分其理最為深邃存其方可矣丹溪禁辛燥丁香白蔻砂仁半夏陳皮之類雖其義極為曉暢存其語可矣若喻嘉言李士材於是症一則商其補脾補腎未悟其脈一則酌其下氣墜痰未達其症然則此症無可治乎曰非也年未登五十燥非其時或為醇酒所傷或為煎熬所中以潤燥為主牛羊乳童便蘆根韭菜汁陳酒茅根之類經驗方酒大黃桃仁歸尾煉蜜為丸茅根汁湯送下兼用四子之書多有得愈者悟到秋來金戀木翻然方見豔陽天後天坎離用事升居乾坤之位於是八卦各易其位震木居離火之位震為蒼龍龍從火里出兌金居坎水之位兌為白虎虎向水中生龍躍虎騰金木交併木之欣欣向榮者不畏金而反愛金雖歷夏而秋常在春三二月之天司馬石渭中端方正直同硯兩載來往數十年如一日也年近五旬酷嗜濃味魚腥胸間隱隱作痛食入即吐人到知心刻期取效心轉疑惑覺古所傳之方一無可用乃會丹溪之意日服蘆根湯而愈遊湘未悟於今三年是夜援筆成論頓興我以暮雲春樹之感體肥脈虛中症論氣為陽血為陰陰陽配偶不參差五臟調和脈斯正惟是體格豐隆一線之微陽不足以敵碩膚之陰軀居恆服溫補性味殊覺相宜寒涼性味一滴逆口由是氣虛是以脈虛耳蓋嘗論之氣無形者也血有形者也有形者全賴無形者為之運用而後足得以行手得以握耳得以聰目得以明鼻得以聞其香臭口得以知其五味雖然尤有進無形者能運有形而不知更有無形者為之主宰無形者方得宣布於四肢充塞於五臟六腑無形者何真氣是也以其所運而言曰真氣以其所居而言曰穀神道德經穀神不死是謂元牝元牝之門是為天地之根手足耳目口鼻皆根竅於元牝元竅一閉耳非不孔竅玲瓏而不能聽目非不黑白分明而不能視鼻非不呼吸出入而不聞香臭口非不咀嚼珍蔬而不知五味手足非不血光紅潤而不握不行今為陰血所壓無形者餒矣無形者餒則有形者亦餒矣古今卒中之症大半患於體肥之人職是故耳方書所載中症許多言說徒事喧譁一言以蔽之曰氣脫其卒然而斃者真氣脫也其斃復蘇者真氣猶存凡氣一時不足以勝形體之任其手足不用不仁者元竅閉也元竅閉調治得宜脈虛脈芤脈遲經驗方黃耆人參焦朮附片秦歸撫芎苡米薑棗引脈洪脈數脈細經驗方熟地人參枸杞秦歸苡米丹皮麥冬五味如初中半身不遂不省人事筋急拘攣口角喎斜語言蹇澀脈弦而數則以風論小續命湯防風一錢二分桂枝麻黃杏仁川芎白芍人參甘草黃芩防己八分附片輕者亦有全愈重者或苟延歲月調治失宜真氣亦不能久留知幾之士見其體肥脈虛時常培養元陽經驗方附片乾薑人參黃耆焦朮肉桂秦歸炙草薑棗引鹿茸桂附丸附片肉桂鹿茸熟地淮藥丹皮棗皮澤瀉茯苓庶有裨焉有形四大皆假合潛確內書四大地水火風也地無堅性水性不住風性無礙火假緣生釋典骨肉為地涕唾津液為水暖氣為火骨節轉運為風達者謂之幻身古佛偈假借四大以為身無形中有主人翁性命圭旨主人翁姓金號元晶自虛無中來居杳冥之鄉岐伯曰中風大法有四一曰偏枯半身不遂也二曰風痱身無疼痛四肢不收三曰風癔奄忽不知人也四曰風痹諸痹類風狀也夫曰風痹真風也所謂偏枯風痱風癔者以其舌強口喑卒倒無知形似乎風因以風名詳究其義實與風毫不相涉就其症而言之手撒脾氣絶矣口開心氣絶矣鼻鼾肺氣絶矣目閉肝氣絶矣遺溺腎氣絶矣汗出如珠髮直如麻面赤如妝真陽鼓散於外矣抉其精而窮其奧總歸宿於腎元蓋腎為性命之根如止見一二經尚未傷及於腎急相其腎之水虧火虧培之補之而受傷之臟自復其初朱丹溪以為痰則生火火則生風固屬捕風捉影李東垣以為本氣自病將風字塗抹其於是症亦似有得究未窺其底蘊河間以為將息失宜心火暴甚而著地黃引子熟地棗皮巴戟附片肉桂蓯蓉茯苓麥冬五味石斛菖蒲遠志可謂抉出疾源矣顧腎水火同宮有痰涎上湧水不足者有面赤煩渴火不足者地黃引子僅足補其火趙養葵又補明水不足者用地黃湯滋其水庶岐伯不言之蘊得以闡明於世治是症者慎勿存一風字於胸中斯得之矣喘急脈論脈經曰上氣喘急候何經手足溫暖脈滑生若得沉澀肢逆冷必然歸死命須傾試申論之人之所賴以生者元氣宗氣而其所以生者則真氣也統一身而言則為元氣元氣充足呼吸自循常度如涉虛怯陰陽之氣亂矣經曰陰爭於內陽擾於外魄汗未藏四逆而起起則熏肺使人喘息體猶溫暖脈多虛滑人參能回元氣於無何有之鄉獨參湯經驗方黃耆一兩秦歸三錢薑棗引喘息自止據中焦而言則為宗氣宗氣轉運升降自無窒礙如沾痰滯陽明之氣鬱矣經曰邪客於陽陰之絡令人氣滿胸中喘息體雖溫暖脈則弦滑法夏和胃而燥痰四七湯人參肉桂法夏炙草薑棗引喘急隨除至於先天一點真元之氣是為真氣至無而含至有至虛而統至實鼓蕩於太虛者雷也而其所以默運乎鼓蕩者非雷也真氣也吹噓乎萬物者風也而其所以驅使乎吹噓者非風也真氣也外護於表內行於里周流一身者氣也而所為主宰以周流者非氣也真氣也釋氏調氣以悟空調此氣也老氏煉氣以歸真煉此氣也儒者養氣以為聖為賢養此氣也釋氏謂之真如錢起贈懷素詩醉里得真如劉禹錫詩心會真如不讀經老氏謂之綿綿道德經綿綿若存儒者謂之浩然其為氣也天地得之萬古不老生人守之壽算常存人而以酒為漿以妄為常醉以入房真氣散矣真氣散一身之元氣宗氣以致營氣衛氣中氣胃氣一齊奔上為喘為急肢之所以逆冷脈之所以沉澀也而命有不傾焉者乎彼水腫之喘以水腫論風寒之喘以風寒論哮症之喘以哮症論熱病之喘以熱病論經中言喘層見迭出各有其本單言喘者止有數條撇開各症方言喘尋到源頭始見醫氣鼓脈弦數論醫學中劉李朱張而下瓣香敬祝者汪子訒庵獨於氣鼓症列之濕門中殊不謂然究其源方書俱然不自訒庵始余考其症是氣也當列於氣門氣以類而方明病雖難而易治夫氣之功用全賴脾土為之轉運氣分氣與氣土分有無形脾屬土有形者也有形之土運氣脾藏意意亦屬土無形者也無形之土運氣有形之土以藥補之無形之土以心養之二者得兼而土斯健矣土旺而氣乃周流四體土衰而氣遂停滯中州貫注軀殼充盈腠理鬱而為熱氣鼓成焉經曰諸脹腹大皆屬於熱是也其為症也四肢日見瘦羸肚腹日見脹滿任人揉按痛癢不關稍進餱糧飽悶難受脾愈虛肝益肆其侮氣愈積熱益張其威脈之弦且數其所由來者有明徵矣治是症者當青筋未大見臍心未大突缺盆未大滿之時重用黃連以解其熱清金以制肝盛培土不受肝邪經驗方人參黃連焦朮麥冬青皮肉桂炙草藥固有維持之力尤宜卻鹹味斷妄想存神靜慮以養無形之土不治氣而氣自宣通多有得安者其名不一曰單脹以其獨脹於腹也曰鼓脹以其中空無物也曰蠱脹若蟲食物而中空也曰熱脹由熱而脹也曰氣脹由氣而脹也統名之曰氣鼓也彼水脹寒脹列於濕門宜也原與此症毫不相涉東垣一代偉人中滿分消丸厚朴一兩枳實黃連黃芩法夏五錢陳皮知母澤瀉三錢茯苓砂仁乾薑二錢人參白朮甘草豬苓一錢蒸餅為丸亦尚未晰分也血症有不必診脈有必須診脈論失血之症有四從齒失者曰齒衄從鼻失者曰鼻衄從咽失者曰嘔血從喉失者曰咳血曰咯血曰吐血曰唾血失血則一而輕重攸分最輕者齒衄足陽明胃脈循鼻入上齒手陽明脈上頸貫頰入下齒二經熱盛其循經之血從齒溢出血路一通即無熱亦時常而來於體無傷不必以藥治者也稍輕者鼻衄凡經之上於頭者皆下通於鼻少陽之脈上抵頭角太陽之脈上額交顛陽明之脈上至額顱其血之循於經者隨氣周流走而不守三經為熱所逼血即從鼻而漏以童便引熱下行茅根清胃降火其血立止至於漏血過多而無休者則不責之血熱而責之氣虛有形血一時所不能滋幾希之氣速當挽回急用參耆補氣以督血經驗方黃耆一兩秦歸三錢薑棗引補氣以攝血補氣以生血雖氣息奄奄亦可回生彼傷寒鼻衄名曰紅汗熱隨血解不必止血亦不必再發汗瘟疫鼻衄名曰外潰毒從血減不必止血亦不必再議下經絡分明見其症即可以用其藥也稍重者嘔血即在胃腑矣貯積日久鬱而上嘔多則盈盆盈碗聚則成塊成堆或一月一嘔或間月一嘔或周年一嘔未嘔之先鬱悶難安已嘔之後神清氣爽但得血路通利有嘔至耄耋而無傷者以恐血阻吸門急備方用紙捻刺鼻中得嚏則通登時至斃方書積案從未有發明其義者蓋胃為五臟六腑之海血易為之聚人而飲食煎熬停留瘀血結成窠臼久則相生相養習以為常如蟻之有穴魚之有淵生生不已補之愈足以滋其黨涼之徒足以塞其路輾轉圖維惟三七鬱金以破負固之城淮膝大黃以開下行之路懸擬方三七鬱金牛膝大黃歸尾桃仁枳實煉蜜為丸掃除而蕩滌之庶有瘳焉常見山居之民採草藥以治血遇是症得愈者居多草藥之性無非破血之品有明徵矣最重者吐血咳血咯血唾血致病之釁原不一端發病之源總歸五臟臟者藏也所以藏其血以養神養魂養魄養意養精與志也心不主血則神為之消散脾不統血則意為之惝恍肝肺不歸血則魂魄為之飄蕩腎不貯血則精志為之梏亡一滴之血性命隨之全憑脈息以決吉凶脈而虛弱火猶未發歸脾湯人參白朮茯苓棗仁龍眼肉黃耆秦歸遠志木香炙草薑棗引養營湯人參白朮黃耆炙草陳皮肉桂秦歸熟地五味茯苓遠志酒芍薑棗引俱能奏效脈而洪數則內火熾矣火愈熾而血愈亡血愈亡而陰愈虛故曰陽邪之甚害必歸陰當此之時寒涼適足以伐五臟之生氣溫補又足以傷兩腎之真陰惟以寒滋其陰而養其陽同癆傷論血或歸其位耳又有一種五臟為內寒所侵血不安位而妄行者脈虛而遲非附子乾薑不足以祛其寒而溫其經經驗方附片乾薑黃耆白朮秦歸炙草建元南棗引此百中僅見一二者至於外寒犯乎五臟擾血逆上者脈浮而緊惟麻黃人參芍藥湯桂枝五分麻黃黃耆甘草白芍一錢人參麥冬三錢五味五粒當歸五分可以攻其寒而安其血此亦血症之常事甚無足怪所以五臟之血必診脈而後能決也綜而計之譬之軍伍齒衄鼻衄巡哨之士卒也嘔血護衛之士卒也咳吐咯唾之血則守營之士卒也巡哨之士卒可失即護衛之士卒可失而守營之士卒斷不可失者也經四十載之推求而血症瞭解閲千百人之性命而血路敢詳司馬劉芹藻忽患失血氣喘脈虛而遲重用附子乾薑黃耆立愈由是留心醫學講解靈素難經咳嗽脈論癆症咳嗽以癆為本不在咳嗽論其餘咳嗽但得病源縷晰無脈不可以治欲達病源先分內外外感咳嗽專責之於肺風寒之來先入皮毛皮毛者肺之合也風寒鬱於肺則咳嗽肺竅得通則咳嗽止焉故古有外感咳嗽則輕之語其脈浮而大散之以蔥白通之以紫蘇參蘇飲人參紫蘇葛根前胡法夏茯苓陳皮甘草枳殼桔梗木香蔥白至於內傷經曰五臟皆令人咳不獨肺然也而要不離乎肺其本經咳嗽也金生在已形寒金冷傷其生氣喘息有音甚則唾血其脈短而遲補之以波蔻溫之以砂仁經驗方人參焦朮雲苓法夏陳皮波蔻砂仁炙草薑棗引其心臟咳嗽也火甚剋金喉中隱隱如梗狀甚則咽腫喉痹其脈浮而洪涼之以黃芩瀉之以山梔經驗方生地赤茯苓山梔生甘草黃芩桔梗麥冬燈芯引其脾臟咳嗽也土不生金陰陰痛引肩背甚則不可動其脈濡而弱培之以黃耆燥之以白朮經驗方人參秦歸黃耆焦朮法夏陳皮雲苓炙草大薑棗引其肝臟咳嗽也木燥火發金被火傷兩脅下痛甚則不可以轉其脈沉而弦制之以鱉甲和之以柴胡熟地鱉甲秦歸柴胡酒芍炙草其腎臟咳嗽也火動水虧金少水涵腰背相引而痛甚則咳涎其脈沉而細滋之以熟地堅之以黃柏知柏地黃湯熟地淮藥棗皮知母丹皮澤瀉茯苓黃柏久咳不已移於五腑病則纏綿難愈治法仍歸五臟彼無痰乾咳火鬱於肺一言盡之升提肺氣甘桔湯桔梗甘草生其津液八仙長壽丹熟地淮藥棗皮麥冬澤瀉茯苓丹皮五味子斯得之矣據經分症即症分脈憑脈用藥夫固有歷歷不爽者經曰秋傷於濕冬必咳嗽經之所言者主氣也四之氣土正在秋初當權喻嘉言以為濕字疑燥字之誤只知歲氣之燥而不知主氣之濕經曰脾苦濕未聞心肺肝腎苦濕河間咳嗽之篇以為濕在脾可也而必分其濕在心在肺在肝在腎何也丹溪論咳嗽有風有寒有痰有火有癆有虛有郁有肺脹庶乎近之降至景嶽所論外感咳嗽大半內傷之方居多所談內傷咳嗽止知陰虛一語雖所重者腎元四臟亦在內傷之列何以曾不之及內傷外感四字尚未解透耶自內而出者喜怒憂思悲恐驚及房勞飲食所傷為內傷自外而入者風寒暑濕燥火及瘟疫痢病所感為外感夫無痰不作咳無嗽不有痰一言咳嗽而痰在其中內經所以有飲無痰飲留腸胃不咳不嗽者自漢儒添一痰字方書遂將咳嗽與痰別為兩門究竟扯東拽西兩無分別書之所以日益支離也泄症脈論難經訓泄有五胃泄飲食不化脾泄腹脹嘔吐所謂大腸泄者食已窘迫可該脾泄論所謂小腸泄者便血腹痛大瘕泄者數至圊而不便宜以痢門論則泄止可言脾胃二經診其脈數而邪之自外來者屬胃其氣化而為熱輕則黃連厚腸佐以利水和胃之品經驗方焦朮雲苓桂枝黃連澤泄豬苓車前苡米至於完穀不化則泄之甚者也須芒硝大黃經驗方芒硝大黃銀花炙草薑棗引滌其邪而泄自止診其脈遲而虛之由內生者屬脾其氣積而為寒輕則焦術和中佐以燥濕補脾之味經驗方黃耆白朮雲苓蓮肉法夏訶子陳皮苡米薑棗引至於脹滿嘔逆則泄之劇者也必附片乾薑經驗方黃耆附片乾薑焦朮肉桂蓮肉炙甘草生薑大棗引嘗與道人分別是症知其隨手輒驗者有由來矣溫其寒而泄乃除夫泄顯而小者也以其泄天妙趣而言則為水先混沌之初沖漠無朕先天一團氤氳之氣降而為水猶未見其昭著漸至昭著而生火猶未有其形質漸有形質而生木猶未至於堅實漸至堅實而生金土則隨行而生郭璞葬經泄天妙趣水居先河圖之數天一生水以其承天時行而言則土為重坤承天之施奉以行之時未至不敢先時以立始時既至不敢後時以墮功坤道之所以順也然載萬物者坤含萬物者坤非有坤以承天則天亦將虛於所施故曰厚德至靜無成有終可知配天之功用者惟坤土獨也正許氏說文重字從土是以土為重之義脾為己土胃為戊土一動一靜一陰一陽互相為用所以十二官中各司一職獨脾胃統司倉廩之官以其物之資始而論惟恃動氣戰乎乾戰即鼓蕩之意謂資始也楊子云太初者氣之始太素者質之始稟乾之始出而為動以其物之資生而論全仗穀氣致役於坤役即孳字之意謂資生也淮南子云毛蟲則橫生倮蟲則縱生萃坤之生養而歸谷脾主消穀胃主納穀一表一里一剛一柔還相為質所以五行寶內但養一臟惟脾胃實養性命之寶至哉坤元厥惟脾胃擬七斗以摩霄上頂心心有七竅高懸西北斷六鰲以立極下臨六腑美盡東南富媼漢書後上富媼敷文宅中葉裳元之吉媒婆方書脾為媒婆踐約婚媾逮冰至之辰卜操柄之有歸說卦傳坤為柄應差豎亥史記天宮書豎亥步經大章行緯占括囊之無咎穩塞夷庚左傳以塞夷庚謂要道也象推吝嗇義取含章後得無患乎先迷方外必根據直內以故胃與脾合馬之所以稱牝也脾與胃分龍之所以戰野也調理得宜百體從茲而安調理失宜百病從茲而起夫泄顯而小者也水腫脈浮大沉細論脈經曰水腫之脈浮大易愈沉細難痊余謂醫不細揣脈與症斯已難矣果脈清症確浮大固可十全沉細未必難痊余少時曾患水腫而回生者欲知水腫幽明路說法何妨我現身人生飲入於胃氣化之妙全憑脾肺腎三經脾專運用之職肺擅通調之官腎司熏蒸之用而後云興雨施滲入膀胱三經失權其氣不化蓄諸中州橫流四肢泛溢皮膚一身之中無非水為之灌注矣以其脈之沉細者言之脈而沉細病愈深而侵入臟矣即脈之沉細分症之陰陽其為陰水腫也形寒傷肺濕寒侵脾虛寒埋腎大便溏瀉小便清利脈則沉細而遲補土以溫金實脾湯焦朮茯苓炙草厚朴肉桂草蔻木瓜木香附片乾薑大棗引實開斯世之福壯水兼補火腎氣湯熟地茯苓山藥丹皮棗皮淮膝車前子附子肉桂澤瀉能挽造化之窮其為陽水腫也火盛剋金熱鬱侮土燥過枯水大便堅硬小便黃赤脈則沉細而數石膏友麥冬經驗方石膏麥冬粳米炙草大棗生薑本草中足稱治水之橇史記夏紀禹治水泥行乘橇山行乘檋橇履器之有齒者今之木屐仿之黃連伴黃柏經驗方黃連苡米黃柏車前肉桂三分知母炙草醫方內大是分水之犀抱朴子犀角一尺以上者刻為魚形銜以入水水即分開余嘗閲是症陰陽俱厥有令人不可測度陽水之厥更有十倍於陰水者陰水誤以陽治先或聲啞而死陽水誤以陰治定是吐血而亡至於脈之浮大邪猶在表病之最淺者也水蓄膀胱五皮飲五加皮地骨皮茯苓皮大腹皮生薑皮可潔清淨之府水行肌表越婢湯石膏八錢麻黃六錢大棗一二枚炙草三錢生薑三錢足開鬼門之關其朝寬暮急暮寬朝急者水隨氣之升降也何必曰陰虛陽虧上氣喘促夜臥難安者水淫肺之葉孔也何必曰子胎母宮曰風水曰石水曰皮水多其水名曰濕腫曰血腫曰風腫總是水腫揣摩脈症辨別臟腑沉細浮大有何難易之分酌理准情無非從前所有之語披肝瀝膽盡是劫後餘生之言其於是症煞吃苦辛矣愁成白髮三千丈歷盡洪濤十八灘人但知浮大為陽沉細為陰而不知沉細中有遲數即有陰陽治之之法相去甚懸世之患是症者多為藥餌所誤惜不早得是而讀之也偏正頭痛不問脈論醫有不知其病而不能治者亦有明知其病而不能治者有莫解其病而莫能療者亦有了解其病而仍莫能療者與哮癇相頡頏而深藏之固更甚於哮癇者正頭風一症或數日一發或數月一發其發也突如其來不因邪觸其止也詘然而止非藉藥醫揣其痛之根不越風毒之客於髓海焉六經皆有頭痛三陽之經上於頭隨其經而醫之藥到而痛自除痛居經絡不到之處羌活防風無所施其勇升麻乾葛無所竭其力柴胡黃芩不能消其事而逐其邪三陰亦令人頭痛或痰壅於胸膈太陰或氣逆於腦頂少陰或冷逼乎督脈厥陰而痛不關於痰氣與風南星半夏燥其痰麻黃附片溫其經吳萸乾薑去其寒燥者自燥溫者自溫去者自去而痛者自痛也本草臚陳空對神農而數典萬書案積莫向仲景而問建抑又聞之劍閣之危險四面拒敵而偏以縋入之鄧艾破蜀至陰平山勢險絶軍士不得過以縋入之逼陽之深固萬夫莫當而偏以老克之左傳逼陽城小而固晉荀偃士丐伐逼陽入於逼陽請於荀罃曰水潦將降懼不能歸請班師荀罃曰牽帥老夫以至於此七日不克必爾乎取之五月庚寅荀偃士丐帥卒攻逼陽親受矢石甲午滅之閲方書鼻淵稱為腦漏腦可漏之出亦可注之入以口服藥而經不通者以鼻注藥而竅自通在揀其解毒去風性味之平正者淡淡注之白菊陳茶煎湯冷注一方皂角細辛研細末吹鼻得嚏則解而痛自漸漸減炙以鼻代口休防郢人之堊莊子郢人鼻端有堊使匠石斫之匠石運斤成風堊去而鼻不傷郢人立不改容追風拔毒何假華他之刀華他字元化漢末沛國譙人通五經精方脈能刳骨療疾為外科之祖有青囊書惜乎無存然此法肇自前人萊蔔汁注鼻之方特取而變化之者至於偏頭風痛丹溪以為左屬風屬火多血虛右屬熱屬痰多氣虛用之未必大驗究其根亦是風毒傍於腦海之旁病之去路多從目出而解同邑石光南所傳淡婆婆一方淡婆婆根為君天麻京子為臣川芎白芷為佐菊花當歸木賊為使黑豆百粒為引初起者用之屢效殊不可解録之以備急用一種手三陽之脈受風寒伏留而不去者名厥頭痛入連在腦者名真頭痛其受邪與正頭風無異而其來也速其死也速更有甚於偏正頭風者古無救方質諸海內名公不知家亦藏有祕方否石光南家纍千金廣為結納高人異士過其地者輒館於書齊所得多醫書未傳之祕方淡婆婆又名淡親家母未考其性但嘗其味亦屬平淡草藥肆購之心氣痛脈論古傳心痛有九循其名而責其實纖毫難溷混一曰蟲凡痛脈多伏今反洪數者蟲也厥名曰蛔長寸許首尾通紅踞於心窩子吮血吸精傷心之患莫慘於是以雄黃檳榔白礬為丸殺之而痛自除二曰疰疰者自上注下也令人沉沉默默心中隱隱作病甚有疰至滅門戶而莫名其病者脈則乍短乍長乍澀乍細非尋常藥餌所能療惟蘇合丸麝香沉香丁香檀香香附蓽茇白朮訶子硃砂青木香烏犀角各二兩薰陸香龍腦各一兩安息香二兩另為末用無灰酒熬膏上為末用安息香膏加煉蜜為丸每兩十九蠟包裹溫水化服阿魏膏楂肉膽星法夏麥芽神麯黃連連翹阿魏蔞仁貝母風化硝枯鹼蘿蔔子胡黃連上為末薑湯浸蒸餅為丸相其本體之強弱寒熱體強而熱阿魏丸體弱而寒蘇合丸庶可以治三曰風風得火而益熾火得風而愈威風而入於心則痛之猝者也其脈浮緊而數以白菊白礬為君侯氏黑風散白菊五錢白礬錢半防風白朮桔梗八分人參茯苓秦歸川芎乾薑細辛牡蠣三分共為末溫酒調可採也四曰悸有觸而驚曰驚無觸而驚曰悸悸而至於痛則悸之甚者也其脈虛而滑加乳香沒藥為使李氏養心湯黃耆茯苓秦歸川芎法夏甘草柏子仁棗仁遠志五味人參肉桂乳香沒藥薑棗引盍用之五曰食食入於胃停滯未化攻衝作痛其脈短而澀平胃散蒼朮厚朴陳皮炙草洵為對症之方六曰飲飲入於胃攻注無常激射作痛其脈濡而遲五苓散豬苓茯苓焦朮澤瀉肉桂實為導水之劑七曰冷寒氣犯於絳宮脈則或遲或結吳萸川椒砂仁木香止痛書何難共證經驗方木香砂仁肉桂等分為末每服五分八曰熱火氣鬱於胸膈脈則或數或促生地梔子黃連苦楝除痛藥確有明文經驗方黑梔仁一兩乾薑一錢五分炙草一錢五分九曰去來痛經脈周流有礙則痛過其所礙而旋止巡至所礙而復發氣充血足何礙之有不必診脈補之可也經驗方黃耆焦朮肉桂秦歸法夏陳皮茯苓炙草薑棗引顧同是心氣痛也以蟲之傷人最酷者居首以疰之傷人最隱者居二以風之傷人最速者居三以悸之介在可以傷可以無傷者居四以飲食之不輕傷人者居五六以寒熱之恆有者居七八以去來痛之人皆知而能治者居九想古人位置之宜亦大費躊躇矣然名則列之有九而義實本之於經曰蟲痛者經言蛔蛔心腹痛也曰疰痛者如飛尸遁尸之類也曰風痛者經言肝心痛也曰悸痛者手少陰之脈起於心中也曰食痛飲痛者足太陰之脈其支上膈注心中也曰冷痛者寒氣客於背俞注於心也曰熱痛者寒氣客於經脈與熱相薄也曰去來痛者經言氣不宣通也要皆非真心痛也若真心痛手足冷至節旦發夕死夕發朝亡彼醫家所傳之方大半言止冷痛本草所注之性間有止熱痛之語夫冷熱之痛病之最淺而最易辨者諸書尚且聚訟何況痛之至隱而至僻者乎領會靈素微詞才是醫家學問變化本草訓語方知用藥權衡腰痛脈論脈要精微論曰腰者腎之府轉移不能腎將憊矣經脈篇曰足少陰之別名曰大鐘實則閉癃虛則腰痛刺腰痛篇曰足太陽脈令人腰痛刺瘧論曰足太陽之瘧令人腰痛細考內景傳圖腰為腎經所居之地膀胱經所過之區腰痛止此二經彼足厥陰足陽明足少陽經本不行腰而言腰痛者牽引而痛也方書所辨未嘗分別其經世醫所治止及腎虛一語夫腎與膀胱一表一里邪之自外來者盡屬太陽之腑痛之自內生者總歸少陰一經診其脈之沉細者而知其痛在少陰焉時痛時止者房勞耗其精也熟地淮藥棗皮澤瀉粉丹茯苓杜仲牛膝枕衾燦爛心迷解語之花唐天寶遺事大液池千葉蓮盛開帝與妃子共賞謂左右曰爭似此解語花雲雨蒼茫神醉遊仙之夢高唐賦昔者先王嘗遊高唐怠而晝寢夢見一婦人曰妾巫山之女也為高唐之客聞君遊高唐願薦枕席時痛時熱者濃味熬其水也熟地淮藥棗皮茯苓澤瀉丹皮黃柏知母山筍湖蒲總無下箸之處晉書何曾日食萬錢對案尚無下箸處膾鯉炮鱉翻為適口之資痛著不移者閃挫竭其力也經驗方熟地丹皮秦歸杜仲續斷淮膝桃仁重舉千鈞自詡扛鼎之力漢書項羽力能打鼎奇經百驗空傳刮骨之文見華他注填骨髓而補真陰為少陰之主藥厥惟地黃調和補瀉燮理陰陽實為護國之臣診其脈之浮緊者而知其痛在太陽焉刺痛背肉者風淫於腎俞穴也經驗方麻黃獨活細辛防風秦歸酒芍生地傴僂而行偏銘考父之鼎左傳正考父之鼎名曰一命而傴再命而僂三命而俯循牆而走痀瘻在望也承丈人之蜩莊子仲尼適楚出於林中見痀瘻者承蜩猶掇之也顧謂弟子曰用志不分乃凝於神其痀瘻丈人之謂乎注痀瘻曲背承蜩以竽黏蜩郁痛畏冷者寒客於氣海俞也經驗方麻黃附子細辛秦歸炙草閒坐淒涼濫廁楚宮之女楚王愛細腰宮女多有不食以求瘦其腰者幽居涬冷空披齊國之紈梁簡文帝啓魯縞齊紈藉新香而受彩梁元帝謝齎錦啓鮮潔齊紈聲高趙轂病重難移者濕著於藏精所也經驗方麻黃蒼朮杜仲淮膝焦朮秦歸茯苓苡米炙草舉止維艱已作支離之態莊子支離疏者頤隱於齊臍肩高於項會撮指天五管官在上兩脾在脅注支離駝子疏人名會撮髮髻屈伸莫遂且無輾轉之嫌調血脈而通關竅為太陽之主藥實為麻黃驅逐客邪通行經絡允推先鋒之將少陰不輕痛太陽之痛居多所以內經麻黃之症特詳今人所治動曰地黃症盍取內經而細玩之也乎腳氣痛脈論諸痛忌補腳氣痛尤甚名曰壅疾壅者濕氣堵截經絡之謂顧其名可以思其義有為寒濕壅者人跡板橋溫庭筠詩雞聲茅店月人跡板橋霜身歷冰霜之慘江深草閣杜甫詩五月江深草閣寒泥多滑澾之侵冷淒之氣下注為濕浸淫筋骨晝夜憎寒作痛其脈濡而遲非蒼朮加皮不足以燥勞筋之濕非乾薑附子不足以祛切骨之寒經驗方蒼朮加皮羌活防風防己附片乾薑秦歸苡米木瓜炙草大棗有為濕熱壅者餐瓜嗜果惟貪口腹之甘旨酒嘉肴不顧肺腸之腐薰蒸之氣下流為濕煎熬陰血臨夜發熱而痛其脈濡而數惟淮通蘇梗庶可以疏閉塞之經惟黃柏麥冬庶可以清蘊隆之熱經驗方淮通蘇梗黃柏麥冬生赤皮秦歸羌活防風苡米木瓜炙草有為風濕壅者濕鬱為熱熱則生風其痛也走注無常輒肆其毒中於踝腫則載塗若跣書說命若跣弗視地厥足用傷中於脛伸則刲痛如刀中於膝形則蓋大如鶴其脈濡浮而數必也大黃芒硝退其火而風斯息防風羌活散其風而濕乃除經驗方大黃芒硝羌活防風秦歸生地牛膝淮通炙草薑棗引斯三者本非廢疾而多致成廢疾者補誤之也跛倚以為容禮記有司跛倚以臨祭許多書齊秀士蹣跚不自便史記子苦蹣跚言足欲進而趑趄也偏及繡閣名姝究其受害之由無非流俗所尚溫補醫者之所為也外有一種蜷縮枯細不腫而痛名曰乾腳氣痛有潤血清燥之方又有一種足跟作痛焮腫而紅名曰陰虛腳痛有補腎養營之劑驗其症或腫或痛審其脈為澀為細可考而知與濕有大不相侔者治是症者勿藉口斯二症而任意補之也可消渴從脈分症論經曰二陽結足陽明胃手陽明大腸謂之消同一結也而氣分血分判焉病在氣分則渴病在血分則不渴消渴以渴為主而判氣血血分亦有渴者氣分結者病發於陽血分結者病發於陰二症相反如同冰炭其發於陽也陽明被火煎熬時引冷水自救脈浮洪而數其發於陰也陽明無水涵濡時引熱水自救脈沉弱而遲發於陽者石膏黃連可以折狂妄之火石膏知母炙草黃連粳米人所共知發於陰者其理最為微妙非三折其肱殊難領會人之灌溉一身全賴兩腎中之水火津液發源於華池湧於廉泉為甘露為瓊漿以養百骸華池兩腎中先天之祖竅水火朕兆處廉泉舌下二穴名猶之甑乘於釜釜中水足釜底火盛而甑自水氣交流倘水涸火熄而甑反乾枯縫裂血分之渴作如是觀當此舌黑腸枯之時非重用熟地不足以滋其水非重用附桂不足以益其火八味湯肉桂附子熟地山藥棗皮澤瀉丹皮雲苓火熾水騰而渴自止余嘗治是症發於陽者十居二三發於陰者十居七八用桂附多至數斤而愈者彼本草所注無非治氣分之品而治血分之藥性不注於本草方實始於仲景至喻嘉言而昌明其說上消如是中下消可類推矣胃熱多食善飢為中消腎熱渴而小便有膏為下消治法仍分氣血下消小便甜者難治水生於甘而死於咸小便本咸而反甘是脾氣下陷腎中土剋水而生氣泄也昔漢武帝患是症仲景進桂附八味湯服之而愈因賜相如服之不效或曰相如之渴發於氣分或曰相如為房勞所傷非草木之精華所能療武帝不賜方而賜以金莖露一杯李商隱詩侍臣最有相如渴不賜金莖露一杯庶幾愈焉未可知也嘔吐脈論嘔吐之症一曰寒一曰熱一曰虛寒則脈遲熱則脈數虛則脈虛即其脈可以分其症最易治者寒陽明為消磨五穀之所喜溫而惡寒一自寒犯於內兩相齟齬食入即吐不食亦嘔彼法夏丁香白蔻砂仁本草所注一派止嘔定吐之品非不神效不如一碗生薑湯而其效更速者經所謂寒氣客於腸胃厥逆上出故痛而嘔是也最誤治者熱寒涼燥烈之性功過參半焉者也丹溪滋腎水而清濕熱原補前賢所未備乃效顰者肆行寒涼人之死於寒涼者非丹溪之罪實不善讀書者之罪有明諸儒救寒涼之弊多為過激之言二百年中寒涼之風一變為燥烈之火人之死乾燥烈者什倍於寒涼遇是症彼曰宜熱此曰宜熱且曰某書某書鑿鑿有憑又安知症屬熱乎哉寒之不已鬱而為熱醫不知其熱仍以辛熱治其寒愈嘔愈熱愈熱愈吐彼麥冬蘆根止嘔定吐書有明文尚不知用何況石膏之大涼大寒乎經驗方石膏麥冬粳米炙草不知石膏為止嘔定吐之上品本草未注其性內經實有其文經曰諸逆上衝皆屬於火諸嘔吐酸暴注下迫皆屬於熱是也最好治者虛不專責之胃而兼責之脾脾具坤靜之德而有乾健之運虛難轉輸逆而嘔吐調理脾胃乃醫家之長策理中湯人參焦朮乾薑附子炙草大棗六君子湯人參焦朮法半夏茯苓陳皮炙草皆能奏效經曰足太陰之脈挾咽連舌本是動則病舌本強食則嘔是也夫嘔吐病之最淺者也噎膈病之至深者也極為易辨嘔吐其來也猝噎膈其來也緩嘔吐得食則吐不食亦有欲嘔之狀噎膈食入方吐不食不嘔嘔吐或寒或熱或虛外見寒熱與虛之形噎膈不食亦與平人一般嘔吐不論年之老幼噎膈多得之老人嘔吐脈有遲有數有虛噎膈脈緩方書所論嘔吐牽扯噎膈之文噎膈半是嘔吐之方有何疑似之難辨而茫無定見也昔在湘中壺碟會友一老醫曰吾治噎膈得愈數人核其藥曰附子理中湯考其症乃脾虛之嘔吐者又一老醫曰吾治噎膈得愈數人核其藥曰黃連法夏湯考其症乃胃熱之嘔吐者諺云藥能醫假病人多得假名其即二老之謂歟至於老人氣鯁時嘗嘔吐不可概以嘔吐論亦不可遽以噎膈論蓋津少氣虛難以傳送古人刻鳩於杖祝其無噎者此也孕婦嘔吐法夏不犯禁例且能安胎準繩已詳言之更有婦人天癸來時為風寒所襲傳送肺經血凝於肺食入即嘔一載有餘醫家以尋常治嘔吐之法治之或寒或熱俱不見效只以桔梗紅花諸藥去瘀生新數劑而愈此又不可不知也痿症不從脈論內經痿論與痹論風論分為三篇病原不同治法亦異方書多雜見於風痹論中將經文混淆後學迷離莫辨按四體縱馳曰痿經曰肺熱葉焦則皮毛虛竭急薄著則生痿躄又曰帶脈不引故足不用經之所言者止痿於足耳而分筋肉骨脈痿道人治之而愈者則不止於足而有頭痿腰痿手痿一身俱痿其論形體枯澤亦與經論稍有差池而其治法仍不外乎經義不過於潤燥活血隊中少加桂為之嚮導篇中所論以所見言與風相近而實相遠不仁不用究非瘓非癱正字通癱瘓四體麻痹筋脈拘急按諸醫書發於左為癱發於右為瘓男多發左女多發右不痛不腫實非瘛非瘲筋急而縮為瘛筋馳而緩為瘲伸縮不己為瘛瘲按瘲馳之瘲外見風症有即發即愈者有歷一二日方愈而復發者有周年半載而不愈者語言依然爽朗神氣依然清明飲食形體依然不變不減令醫有莫知所適從者考本草所注黃柏蒼朮為治痿之要藥醫多不解不敢輕用而以為脾主四肢純以補脾溫脾之品治之致痿成終身者比比矣間亦有幸用而獲效者第知病之愈而不知病之所以愈盍讀內經而恍然焉經曰治痿獨取陽明陽明主潤宗筋為濕熱所傷宗筋不潤弛而不能束骨發而為痿蒼朮陡健陽明經黃柏清熱而堅骨藥到病除而後嘆古人名為二妙實有妙不可言者夫病源不清見其方而不敢用其藥病源既清推其類可以盡其余麥冬能治痿者經驗方麥冬粳米煮粥濕熱蒸肺肺葉焦而難以宣布乾地能治痿者經驗方乾地黃四兩黃柏一兩知母一兩肉桂一錢煉蜜為丸濕熱傷血血脈涸而不能養筋本草所注可以清熱而涼血者皆可以治痿也病自我識方自我立書傳古方為後人之法程明君臣之義補瀉之理非謂即以其方治病南北之水土不同古今之時勢不同年齒之老幼不同冬夏之寒燠不同賦稟之厚薄不同氣質之清濁不同境遇之順逆不同是在為醫者運用之妙存乎一心有是症必有是方即不用黃柏蒼朮可即倍黃柏蒼朮亦可其或兼風兼痹兼虛雜用治風治痹補虛有何不可至於脈置之勿論可也風痹脈論病有明醫能治草醫能治而大醫不能治者風痹也痹者閉也謂兼寒濕閉塞經絡而痛也內經所以有風勝寒勝濕勝之分而有行痹痛痹著痹之語診其脈浮緊而弦要歸於風病發肝經殃及肢體中於骨則伸而不屈中於筋則屈而不伸中於血則凝澀而不流通治之之法羌活防風疏其風紫蘇青皮行其滯加皮黃柏堅其骨苡米木瓜舒其筋蒼朮防己燥其濕松節茄根散其寒人參白朮補其氣生地秦歸活其血有雜合之症斯有雜合之方經驗方羌活防風石膏側柏葉黃松節苡米木瓜秦歸炙草生地黃倘鬱而為熱脈數無論又當大泄其熱閉而積寒脈遲不來又當重溫其經所謂明醫者黑籍除名丹經注字儒釋道心歸一貫天地人理統三才名山考道面壁九年勝地棲身足濯萬里其於是症外有以燭照五運六氣之淫邪內有以洞鑑五臟六腑之亢害用風藥為君有用至數斤而愈者用大黃泄熱有用至數斤而愈者用附子溫經有用至數斤而愈者大醫見之而咋舌草醫見之而傾心也草醫何以敢與明醫抗衡哉是症經驗之方有用之一世者有用之二世者有用之三世者奇貨可居匪伊朝夕矣採藥於深山虎穴漢書班超曰不入虎穴焉得虎子蠶叢成都記蠶叢氏蜀君也李白詩見說蠶叢路崎嶇不易行不辭登陟教子於密室雅塗盧同詩忽來案上翻墨汁塗抹滿書如老雅蚓跡唐太宗王羲之傳論肖子云擅名江表然無丈夫氣行行若潔春蚓字字如綰秋蛇大費躊躇購米市鹽信是傳家之寶枕流漱石晉孫楚欲隱居誤云枕流漱石王濟曰流可枕石可漱乎楚曰枕流欲洗其耳漱石欲礪其齒希圖待聘之珍想其附耳低言吾祖如是而屢效焉吾父如是而屢效焉吾身如是而屢效焉一卷之書不從理解得之不從藥性得之而從經驗得之乃知岩谷生苗必非無故舉凡玉女爾雅注似葛蔓生有節江東呼用龍尾亦謂之虎葛細葉赤莖睽姑爾雅注鉤𤬏也一名王瓜實如瓝瓜正赤味苦雞頭鴨腳洛陽伽蘭記生筋狗骨之木雞頭鴨腳之草亦悉備焉無非逐風燥濕祛寒之品妙手所得適與是症相當而與明醫吻合所以大醫見草醫而驚訝明醫見草醫而肅然起敬也世之所稱大醫者我知之矣非醫大也補大之也補何以大藥大而醫亦大耳其出門也衣輕策肥揚鞭周道意氣可謂都矣其診脈也凝神閉目兀坐終朝經營可謂苦矣其開方也咀筆濡毫沉吟半晌心思可謂專矣及閲其所撰之單黃耆白朮附子乾薑詎知熱得補而益烈寒濕得補而益凝輾轉糾纏釀成不用可勝悼嘆蓋嘗微窺底蘊其素所挾持者然也咄咄逼人獨會醫門之捷徑揚揚得意別開海上之奇方原未夢見何者為脾胃何者為命門開口不曰脾胃土敗便曰命門火衰本草千百味約之不滿十味古籍千百方算來止用兩方何分內外之傷概歸一補不論陰陽之症總是一溫靈樞素問一筆可勾湯液本草名伊尹著難經百年難學漢唐宋元之書許多闡發張朱劉李之論徒事鋪張從來醫書萬言記得僅有三言人心七竅剖開全無一竅彼冬蟲語冰莊子夏蟲不可以語於冰者篤於時也徒知有寒不知有熱方諸春蛙坐井莊子井蛙不可以語於海者拘於墟也韓愈原道篇坐井而觀天曰天小者非天小也不知有石與實同音止知有墟與虛同音可惜英雄將相枉罹非辜劇憐才子佳人空傷不祿午夜雞鳴不作回頭之想半生馬跡悉是撓舌之方結撓其舌而不能飲食不能言語大醫所以見明醫引身而避草醫見大醫而羞與之為伍也噫明醫不世有草醫不敢用大醫之流毒宜乎衆矣老痰不變脈論天下怪怪奇奇之症診其脈依然園靜和平者老痰也夫痰之名不一其源亦不一皆足以變脈惟老痰隱伏於腸胃迥薄之處不關五臟不傷六腑故脈不變但年積久而作崇以余所親自閲歷怪症百出者言之有耳初聞蟬嘒聲次聞風雨聲久之聞雷霆聲者有目初見房屋欹斜次見山川崩裂後見平地沉陷者有喜聞吉祥語如言鄉會試擢詞林點狀元則神完氣足手舞足蹈倘聞言凶事如疾病災難死喪之類則氣絶神消而死者有自覺一條蟲由頭走至背自背走至胸若痛若癢手莫可支者有日見一個白鼠由壁走上梁由梁走地下呼人打鼠者有日見一個白貓兒時走堂前時伏書案獅子尾毛長寸許潤澤豐滿性馴可愛招人觀玩者有旦晝安靜無異平人夜不上床時寐時寤語言支吾欲兩三人陪坐以待旦者有日則舉動如常飲食如舊臨夜病症百出莫可名言呻吟床褥直到天明者有靜坐一室只許妻兒相見若見他人心驚膽怯無地躲避者有見物與平人無二及見小兒止數寸高大人不過尺許者有神充氣足到晚自揣必死將家事一一分咐妻兒輩漸漸神消氣餒儼然死去醒則仍復其元或數日一發一月一發者有睡至半月方醒醒則氣體強健飲食倍進不過兩三日後睡如初者有一月方食氣血不減精神少衰者皆竊取王隱居滾痰丸治之而全愈者也滾痰丸青礞石一兩沉香五錢酒大黃酒黃芩各八兩上將礞石打碎用焰硝一兩同入瓦罐內鹽泥固濟曬乾火煅石色如金為度研末合諸藥水丸臨臥時每服二錢五分生薑送下惜隱君制其方未言及於脈醫無所據不敢輕用吾邑蔣渭浦諱熊藻著九門奇方書以痰門居首獨推此方實為隱君之功臣亦未會通乎脈止可一人用之而不可與衆人共用遂使其書其方庋之閣上不大盛傳苟知以脈證病用滾痰丸直行無所事耳世之患怪怪奇奇之症者一旦值此而沉疴頓除王隱君濟世之婆心得以闡明於世即吾邑蔣渭浦創書之美意亦幸當代之有傳人矣癇症脈論諸癇病發卒倒抽掣叫吼吐涎因其聲之似而有豬癇馬癇羊癇牛癇雞癇之分溯其源卒倒無知者痰迷心竅也搐搦抽掣者風入肝經也名雖不一不外心肝二經經曰脈滑大久自已脈堅小死不治有得之胎前者兒在母腹其母猝然受驚痰氣逼入心肝與本來氣血搏見成窠此不可治者也有得之懷抱者小兒心肝有餘神氣不足偶有所觸風動於肝火發於心神不守舍痰涎蔓衍浸淫乘其隙而入之據以為主此介於可治不可治者也有得之成人者外感風寒內傷飲食逆於臟氣閉塞諸經鬱而生痰膠固心肝此無不可治者也夫有桀驁不馴之虜必恃斬關奪隘之才有頑梗難化之梟必須執鋭披堅之勇蓋負嵎徑敵非詩書所能啓牖仁義所能漸摩禮樂所能陶淑不得不挽強弓操毒矢以摧其鋒而搗其窟痰之凝結心肝亦由是也彼挾心肝以淬其鋒溫之而余氛愈熾據心肝以完其窟和之而固壘難降且脅心肝以成其黨而樹其敵補之而邪焰鴟張求其剽悍之性直抵巢穴而能殺伐者其惟礞石與麝香乎可以撥亂而反正能平肝下氣為治驚利痰之聖藥余於是症胎病無論已小兒未曾診視稍得成人但脈浮大概以礞石滾痰丸麝香丸攻之日服六君子湯一帖得愈者無數有服至一月愈者有服至兩月愈者以痰盡為度經曰有故無殞不信然歟難經訓癲為僵仆直視與癇無異進閲內經癲狂篇亦大同小異以為癇即癲者非也內經明有三條之論以為癇不同於癲者亦非也所言癲癇兩相倣佛故闕之以俟參考麝香丸方法夏膽星陳皮枳實麝香雲苓青皮炙草生薑汁為丸一方治小兒乳哮姜蟲伴糯米浸與浮沫去米焙乾研細末米湯調服哮症脈亂無妨論內經有喘正哮至漢方哮喘並論喘之源不一哮之源止有冷痰入肺竅而已夫肺為嬌臟清虛之質不容些毫芥蒂懸於胸間其竅仰上一有所入則不能出人而飲冰食果積成冷痰浸淫於內是為痰母物交物則引之而已矣一為潮上肺竅為之閉塞呼吸亂矣呼吸亂而二十七脈之迭見而雜出者無所不至其遇寒而發者寒與寒感痰因感而潮上也其遇熱而發者寒為熱蒸痰因蒸而潮上也必待鬱悶之極咳出一點如魚腦髓之形而症斯愈脈亦隨之而平本草所訓性味猛烈惟麻黃砒石可以開其關而劫其痰麻黃能發汗一到哮症雖盛夏之月不發汗砒石能傷人一到哮症雖羸弱之軀不傷人有是症有是藥而卒不能除其根者麻黃能通痰塞之路而不能拔痰踞之窠砒石能剿痰招之黨而不能殲痰伏之魁藥到即愈愈而復發者此也余嘗見老人患癆傷咳嗽吐血體瘦脈數敗症備矣詢其素有哮症癆無可治者以二藥治其哮得愈者數人又嘗見老人患上氣咳嗽喘悶脈急不寐困頓極矣問其素有哮症氣無可治者以二藥治其哮得愈者亦數人瑤池古冰雪為肺擬冷痰斯言近之矣制砒石法以淡豆豉曬乾研末一兩砒石一錢飯和為丸刺史家節庵歷宦四十年解組歸里年已七十矣患哮喘不寐服麻黃而愈重一本之親招諸玉砌結三生之願待聆金音雅意殷殷命著是篇

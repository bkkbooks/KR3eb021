body:
  text: 賦以全求有眾皆生育為韻自呼夢覺周君自號夢覺道人人喚小癲道人家前有周癲人故以小癲別之荊楚鍾英道人字荊威士林望重雷霆警眾道人名學霆郡志名傳錄鉛汞于丹灶參同契夫鉛乃君汞乃臣志林龍者汞也精也血也出於腎虎者鉛也氣也力也出於心庚信詩自可尋丹灶驅草木以赭鞭史記帝作蜡祭以赭鞭鞭草木帝神農也以赭鞭鞭打草木使萌動也語云神農嘗百草而知藥性蓋本諸此現身說法彈指參禪本傳燈錄古有一指禪成一家言之心裁即機杼一家之意作作有芒史記天官書作作有芒國其昌大率微詞奧旨出蔡沈尚書序分四庫書之體裁甲乙丙丁分為四庫藏經史子集諸書多多益善漢淮陰候韓信將兵事不遺斷簡殘編出文選藻思頻催錢起詩文人藻思催鬼神默為啟牖道人撰數脈解是夜更深燈盞無油光芒漸漸長至五六寸高輝煌滿室直達天明撰三焦辨是夜漏水忽聽門外喧嚷騎擁多人瞬息間一方巾秀士站立身旁良久方去薪傳不盡莊子指窮於為薪火傳也不知其盡也倫物宜荷生全病應手而即愈人謂手底生春爾其九年面壁傳燈錄達摩祖師至少林寺面壁九年始悟而成佛六度行舟江總棲霞寺碑三乘謂筏六度為舟言庚庚而更卓鄭元祜詩兩徐識解更卓特著書翼慎言庚庚原按謂徐鉉徐諧注許慎說文思乙乙其若抽陸士衡文賦靈素難經釀花作蜜蜂採花蕊以釀之而成蜜醫方脈訣集腋成裘呂氏春秋天下無粹白之狐而有粹白之裘取之眾白也雖海上之奇方無能為役語出左傳彼醫門之捷徑亦又何求語本周頌折肱者三出左傳笑倩拈花之指傳燈錄世傳拈花迦葉獨破顏微笑世尊云吾正法眼藏分付於汝拍案者再拍案稱奇謂文章之奪目點憑頑石之頭梁高僧講經於虎邱寺聚石為徒頑石為之點頭蓋學不殊於半豹晉書謝靈運云若殷仲文讀書半袁豹則文才不減班固斯技無愧乎全牛莊子庖丁曰始臣解牛之時所見無非牛者三年之後未嘗見全牛也李商隱文學殊半豹技愧全牛是以仰體三無禮記天無私覆地分私載日月無私照兼包萬有不恤傾囊有孚盈缶二句本易經白蓮集於齊已源紹木公浩然齋雅談唐僧齊已有白蓮集為風騷旨格紅藥傳於謝庚諦參金母西清詩話末僧謝庚詩多清麗有紅藥詞傳於世西王母傳仙人得道昇天當揖金母而拜木公契前三之語傳燈錄問佛法如何住持曰龍蛇混雜凡聖同居師曰多少眾翁曰前三三後三三意在筆先陶宗儀說郛王維畫學秘訣凡畫山水意在筆先留丈六之身蘇軾詩問禪不契前三語施佛空留丈六身方垂肘後孫思遂有肘後方慈航慧海梁昭明太子詩慧海渡慈航輪王委通慧之心開通智慧寶筏迷津李白詩金繩開覺路寶筏度迷津梵帝伸指迷之手指引迷津宋之問詩果漸輪王族緣超梵帝家神針暗渡本薛靈芸刺繡事錄合號以傳燈宋史僧道原景德傳燈錄三十卷明鏡高懸用陳良翰虛堂懸鏡事言心眼之朗明也六祖慧能云明鏡亦非臺書林疑其覆瓿用楊子云語謂是書之必傳也乃知鹿苑婆娑珠林母鹿生鹿女形極美金仙養之後佛母生於鹿女因名鹿苑雞園舞弄楞嚴經我在鹿苑及於雞園觀如來最初成道尋玉版以談元用蘇東坡訪玉版禪師談元事玉版禪師筍也設蘭盆以餞送釋氏中元節設盂蘭盆以迫薦鬼神奇超白石之糧神仙傳白石先生常煮白石為糧妙入黃梁之夢呂純陽遺蘆生事夢寤而黃梁猶未熟也攤寶書之玉軸用黃山谷詩鯨尚可騎仙人每跨鯨魚吸仙露與金莖漢武帝金莖承露取而飲之得仙鶴飛難控周王子晉緱山乘鶴窗舒意蕊僉躋壽寓福林出文選室度心香梁簡文帝相國寺碑銘窗舒意蕊室度心香那借汗牛充棟言書籍之多直使汗牛充棟種菩提之樹神秀詩身是菩提樹六祖慧能詩菩提本無樹濃披美蔭以庇人莊子睹一禪方得美蔭泛般若之舟梁簡文帝倡導丈泛般若之舟大樣恩波而濟眾彼夫騷人寄興諸子遣懷採漢儒之學海拾遺記何休為學海鬥唐室之詩牌云仙雜錄李白遊慈恩寺僧用水松牌乞詩詞瀉老莊信是周家著述老莊莊周皆周人學宗陳邵陳希夷先生傳邵康節先生雍羞同晉代恢諧如樂廣之流天文地理之精任摩挲於玉腕摩挲神物玉腕言手腕之貴也魚躍鳶飛之趣此二語詩詠之子思引之程子以活潑潑地贊之朱子於書舍書而懸之其悟道也皆然供吐納於肖齋國史補梁武帝造寺令肖子云飛白大書肖字至今一肖字存焉故時有肖寺肖宮肖齋之稱鼓吹成群孔稚圭以蛙聲當兩部鼓吹鄙官娃之閣閣晉惠帝問蝦蟆事閣閣鳴聲推敲得意賈島與韓愈商量詩中推敲字愈曰敲字佳矣羨儀鳳之喈喈鳳鳴喈喈絳雪元霜漢武帝內傳仙家上藥有絳雪元霜參觀即是慈雲法雨雞蹠集如來慈心如彼大云蔭注世界王維六祖碑大興法雨觸處孔皆則有丹經益壽宋史皇甫坦傳召問以長生久視之術坦曰丹經萬卷不如守一綠字留名梁簡文帝大法頌綠字擒章逢凶化吉起死回生字挾風霜西京雜記淮南王安著鴻烈二十一篇自云字中皆挾風霜一字媲開天之畫伏羲作卦一畫開天文光日月魚隱叢話淮西功德冠吾唐吏部文章日月光千文喧擲地之聲梁周興嗣作千字丈孫綽作天台山賦既成以示範榮期期曰此賦擲地當作金石聲想入非非涅槃經無非想無非非想刺膏肓而病將神爽左傳二堅子避膏之下肓之上作針砭而聞亦驚心鐵針磁砭可以治病謂藥石也歡喜丸躊躇滿志法苑珠林五百鹿車栽種種歡喜丸清涼散慘淡經營侯鯖錄劉子儀三入翰林稱疾不出朝士候之云虛熱上攻石中立云只消一服清涼散謂兩府始得用清涼傘也此借用躊躇滿志本莊子慘淡經營本杜詩緊惟有腳之春唐宋景惠澤遍施於民人謂為有腳陽春帲幪者廣本楊子是以如椽之筆晉王珣嘗夢人以大筆如椽與之其後文思日進濡染而成濡毫染翰然則因善病而廢書道人世習詩書自幼應童子試輒冠軍後因病搜方遂明醫理應延請而廢書乃業醫以邀福道人之病自立新方治之而病以全愈綜儒釋道淵源之教統會禪醫道人深悟禪機故醫書亦號禪萃天地人參贊之才胥歸化育范文正公曰不為良相當為良醫原謂其可以贊天地之化育圓通頓悟楞嚴經若能於此悟圓通根納芥子於須彌維摩詰經以須彌山之高廣納芥子中而不迫窄崑崙山西方曰須彌山方便隨行維摩經摩詰以無量方便饒益眾生識廬山之面目廬山以匡廬隱居得名故云始識廬山真面目庋手澤於高閣私專樝梨南史張敷小名樝父小名梨帝戲曰樝何如梨答曰梨百果之宗樝何敢比道人先世皆讀書掇科故云引眾生於慧門佛經通慧為門共銘饘粥左傳正考父之鼎銘曰饘於斯粥於斯曼倩之桃有核馬臻詩飢懷曼倩桃庚信詩漢帝看桃核處處延齡啖之延年益壽安期之棗如瓜史記臣嘗遊海上見安期生食巨棗如瓜人人果腹莊子其腹果然非關剿襲凡盜人之文章以為藍本曰勦襲是書語語出自胸裁毫無此弊豈拘弓學箕而治學裘禮記良弓之子必學為箕良冶之子必學為裘儻事品題一經品題便成佳士定屬豐年玉而荒年穀劉義慶世說庚文康為豐年玉玉樨恭為荒年穀是書未刻之先夜夢一道人談禪精奧問其姓名曰吉祥順明日遇夢覺道人於貢院西街行止異常與夢中所見適合一笠一缽外袖中止藏三指禪三卷因請而梓之道人周姓始悟不言周而言吉者乃仙家隱語省一圍也名吉祥順者道人本慈祥之念順天地好生之德以濟人也梓成因錄數語以志其異
